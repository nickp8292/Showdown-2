<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Casino Football</title>
<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    background:
        radial-gradient(circle at top,#292929,#050505 75%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding:8px;
}
.game{
    width:100%;
    max-width:1150px;
    margin:auto;
}
/* =========================
HEADER
========================= */
header{
    text-align:center;
    margin-bottom:8px;
}
header h1{
    margin:0;
    font-size:clamp(28px,6vw,52px);
    letter-spacing:3px;
    text-transform:uppercase;
}
.subtitle{
    color:#ffd83d;
    font-size:12px;
    letter-spacing:2px;
}
/* =========================
SCOREBOARD
========================= */
.scoreboard{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-bottom:8px;
}
.scorebox{
    background:linear-gradient(#202020,#0d0d0d);
    border:2px solid #444;
    border-radius:10px;
    padding:7px;
    text-align:center;
}
.score-label{
    color:#999;
    font-size:10px;
    text-transform:uppercase;
}
.score{
    font-size:26px;
    font-weight:900;
}
.clock{
    color:#ffd83d;
    font-size:27px;
}
.possession{
    color:#61d9ff;
    font-size:12px;
    margin-top:2px;
}
/* =========================
FIELD
========================= */
.field-wrap{
    background:#111;
    border:2px solid #333;
    border-radius:13px;
    padding:6px;
}
.field{
    position:relative;
    width:100%;
    aspect-ratio:16/6.5;
    min-height:230px;
    overflow:hidden;
    border:4px solid white;
    border-radius:8px;
    background:
        repeating-linear-gradient(
            90deg,
            #147a38 0%,
            #147a38 4.95%,
            #198b40 4.95%,
            #198b40 9.9%
        );
}
.yardline{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,255,255,.5);
}
.l10{left:10%}
.l20{left:20%}
.l30{left:30%}
.l40{left:40%}
.l50{
    left:50%;
    width:3px;
    background:white;
}
.l60{left:60%}
.l70{left:70%}
.l80{left:80%}
.l90{left:90%}
.endzone{
    position:absolute;
    top:0;
    bottom:0;
    width:10%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    writing-mode:vertical-rl;
    background:rgba(0,0,0,.2);
}
.leftzone{left:0}
.rightzone{right:0}
.field-status{
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    border-radius:20px;
    padding:6px 14px;
    font-weight:bold;
    font-size:12px;
    z-index:5;
    white-space:nowrap;
}
.ball{
    position:absolute;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 35% 25%,#ffd875,#9c4b0c);
    border:3px solid white;
    box-shadow:
        0 0 12px #ffd83d,
        0 0 25px rgba(255,200,40,.6);
    z-index:10;
    transition:
        left 1s cubic-bezier(.2,.8,.2,1),
        top .35s ease;
}
.ball::after{
    content:"🏈";
    font-size:19px;
}
/* =========================
PLAY MESSAGE
========================= */
.play-message{
    text-align:center;
    min-height:45px;
    padding:5px;
}
.play-result{
    font-size:25px;
    font-weight:900;
}
.play-detail{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
}
/* =========================
WHEEL
========================= */
.wheel-section{
    margin:5px auto 10px;
    text-align:center;
}
.wheel-title{
    font-size:14px;
    font-weight:bold;
    color:#ffd83d;
    letter-spacing:2px;
    margin-bottom:4px;
}
.wheel-container{
    position:relative;
    width:min(92vw,470px);
    height:min(92vw,470px);
    margin:auto;
}
/* THE ACTUAL WHEEL */
#wheel{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    border-radius:50%;
    transition:
        transform 4.8s cubic-bezier(.08,.78,.12,1);
    filter:
        drop-shadow(0 0 18px rgba(255,210,50,.4));
    z-index:2;
}
/* outer casino lights */
.wheel-lights{
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:8px dotted #ffd83d;
    animation:
        lights 1s linear infinite;
    pointer-events:none;
    z-index:3;
}
@keyframes lights{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
/* POINTER */
.pointer{
    position:absolute;
    top:-3px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:19px solid transparent;
    border-right:19px solid transparent;
    border-top:42px solid white;
    filter:
        drop-shadow(0 3px 5px black);
    z-index:20;
}
/* center */
.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:82px;
    height:82px;
    border-radius:50%;
    background:
        radial-gradient(circle,#ffe36c,#d18b00);
    border:6px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    font-size:11px;
    font-weight:900;
    text-align:center;
    box-shadow:
        0 0 20px rgba(255,215,60,.9);
    z-index:15;
}
/* =========================
CALLS
========================= */
.calls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.panel{
    background:linear-gradient(#1c1c1c,#0c0c0c);
    border:2px solid #393939;
    border-radius:10px;
    padding:8px;
}
.panel h2{
    text-align:center;
    font-size:14px;
    margin:0 0 7px;
}
.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}
button{
    border:0;
    border-radius:7px;
    padding:12px 5px;
    color:white;
    background:#292929;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}
button:hover{
    background:#414141;
    transform:translateY(-2px);
}
button.selected{
    background:
        linear-gradient(135deg,#ffe66b,#df9700);
    color:#111;
    box-shadow:
        0 0 14px rgba(255,215,50,.55);
}
button:disabled{
    opacity:.3;
    cursor:not-allowed;
    transform:none;
}
/* =========================
SPIN
========================= */
.spin-area{
    text-align:center;
    margin-top:9px;
}
.spin-button{
    width:100%;
    max-width:450px;
    padding:17px;
    font-size:21px;
    background:
        linear-gradient(
            135deg,
            #fff080,
            #f0a800,
            #fff080
        );
    color:#111;
    border:3px solid white;
    box-shadow:
        0 0 22px rgba(255,215,50,.5);
}
.spin-button:not(:disabled){
    animation:pulse 1.4s infinite;
}
@keyframes pulse{
    0%,100%{
        box-shadow:0 0 15px rgba(255,215,50,.35);
    }
    50%{
        box-shadow:0 0 30px rgba(255,215,50,.85);
    }
}
.message{
    text-align:center;
    color:#888;
    font-size:11px;
    margin:6px;
}
@media(max-width:700px){
    .calls{
        grid-template-columns:1fr;
    }
    .field{
        min-height:190px;
    }
    .wheel-container{
        width:min(94vw,390px);
        height:min(94vw,390px);
    }
    .play-result{
        font-size:21px;
    }
}
</style>
</head>
<body>
<div class="game">
<header>
    <h1>🎰 CASINO FOOTBALL</h1>
    <div class="subtitle">
        CALL THE MATCHUP • SPIN THE ODDS
    </div>
</header>
<!-- SCOREBOARD -->
<div class="scoreboard">
    <div class="scorebox">
        <div class="score-label">YOU</div>
        <div class="score" id="yourScore">0</div>
        <div class="possession" id="yourPossession">
            🏈 POSSESSION
        </div>
    </div>
    <div class="scorebox">
        <div class="score-label">GAME CLOCK</div>
        <div class="score clock" id="clock">
            Q1&nbsp;&nbsp;15:00
        </div>
        <div class="possession" id="quarterText">
            1st Quarter
        </div>
    </div>
    <div class="scorebox">
        <div class="score-label">OPPONENT</div>
        <div class="score" id="cpuScore">0</div>
        <div class="possession" id="cpuPossession">
            —
        </div>
    </div>
</div>
<!-- FIELD -->
<div class="field-wrap">
<div class="field">
    <div class="endzone leftzone">
        YOUR END ZONE
    </div>
    <div class="endzone rightzone">
        END ZONE
    </div>
    <div class="yardline l10"></div>
    <div class="yardline l20"></div>
    <div class="yardline l30"></div>
    <div class="yardline l40"></div>
    <div class="yardline l50"></div>
    <div class="yardline l60"></div>
    <div class="yardline l70"></div>
    <div class="yardline l80"></div>
    <div class="yardline l90"></div>
    <div class="field-status" id="fieldStatus">
        Your 20
    </div>
    <div class="ball" id="ball"></div>
</div>
</div>
<!-- PLAY RESULT -->
<div class="play-message">
    <div class="play-result" id="result">
        CALL YOUR PLAY
    </div>
    <div class="play-detail" id="detail">
        Defense first. Then offense.
    </div>
</div>
<!-- WHEEL -->
<div class="wheel-section">
    <div class="wheel-title">
        🎰 THE PLAY WHEEL
    </div>
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas
            id="wheel"
            width="700"
            height="700">
        </canvas>
        <div class="wheel-lights"></div>
        <div class="center" id="center">
            SPIN
        </div>
    </div>
</div>
<!-- CALLS -->
<div class="calls">
    <div class="panel">
        <h2>🛡️ DEFENSE</h2>
        <div class="buttons">
            <button id="zone"
                onclick="selectDefense('zone')">
                🟢 ZONE
            </button>
            <button id="man"
                onclick="selectDefense('man')">
                🔵 MAN
            </button>
            <button id="blitz"
                onclick="selectDefense('blitz')">
                🔥 BLITZ
            </button>
            <button id="allblitz"
                onclick="selectDefense('allblitz')">
                💥 ALL-OUT
            </button>
        </div>
    </div>
    <div class="panel">
        <h2>🏈 OFFENSE</h2>
        <div class="buttons">
            <button id="run"
                onclick="selectOffense('run')">
                🏃 RUN
            </button>
            <button id="short"
                onclick="selectOffense('short')">
                🟨 SHORT PASS
            </button>
            <button id="medium"
                onclick="selectOffense('medium')">
                🟦 MEDIUM PASS
            </button>
            <button id="deep"
                onclick="selectOffense('deep')">
                🔥 DEEP PASS
            </button>
        </div>
    </div>
</div>
<div class="spin-area">
    <button
        class="spin-button"
        id="spinButton"
        onclick="spinWheel()"
        disabled>
        🎰 SPIN THE ODDS
    </button>
</div>
<div class="message" id="message">
    Choose your defensive and offensive calls.
</div>
</div>
<script>
/* =========================================
GAME STATE
========================================= */
let defense = null;
let offense = null;
let spinning = false;
let ball = 20;
let down = 1;
let yardsToGo = 10;
let yourScore = 0;
let cpuScore = 0;
let possession = "you";
let quarter = 1;
let clock = 900;
let wheelRotation = 0;
let segments = [];
const canvas =
    document.getElementById("wheel");
const ctx =
    canvas.getContext("2d");
/* =========================================
WHEEL COLORS
========================================= */
const colors = [
    "#0a9d4b",
    "#1b8bd1",
    "#e0b600",
    "#e67e22",
    "#0a9d4b",
    "#8c1735",
    "#b31d1d",
    "#4c0710"
];
/* =========================================
DRAW WHEEL
========================================= */
function drawWheel(){
    const cx = 350;
    const cy = 350;
    const radius = 330;
    ctx.clearRect(0,0,700,700);
    const angle =
        Math.PI * 2 / segments.length;
    segments.forEach((s,i)=>{
        const start =
            i * angle;
        const end =
            start + angle;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );
        ctx.closePath();
        ctx.fillStyle =
            colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle =
            "#ffffff";
        ctx.lineWidth = 6;
        ctx.stroke();
        /* TEXT */
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(
            start + angle/2
        );
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "white";
        let size = 26;
        if(s.label.length > 8)
            size = 19;
        ctx.font =
            "900 " + size + "px Arial";
        ctx.shadowColor =
            "rgba(0,0,0,.8)";
        ctx.shadowBlur = 5;
        ctx.fillText(
            s.label,
            radius - 25,
            0
        );
        ctx.restore();
    });
}
/* =========================================
BUILD MATCHUP
========================================= */
function buildWheel(){
    /*
    ----------------------------
    RUN
    ----------------------------
    */
    if(offense === "run"){
        if(defense === "zone"){
            segments = [
                {label:"0 YDS",value:0},
                {label:"+1",value:1},
                {label:"+2",value:2},
                {label:"+2",value:2},
                {label:"+3",value:3},
                {label:"+4",value:4},
                {label:"+6",value:6},
                {label:"LOSS",value:-3}
            ];
        }
        else if(defense === "man"){
            segments = [
                {label:"0",value:0},
                {label:"+2",value:2},
                {label:"+3",value:3},
                {label:"+4",value:4},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+10",value:10},
                {label:"LOSS",value:-2}
            ];
        }
        else if(
            defense === "blitz" ||
            defense === "allblitz"
        ){
            /*
            Blitz vs run:
            dangerous but exploitable.
            */
            segments = [
                {label:"-5",value:-5},
                {label:"-2",value:-2},
                {label:"+1",value:1},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+8",value:8},
                {label:"+15",value:15},
                {label:"BREAKAWAY",value:25}
            ];
        }
    }
    /*
    ----------------------------
    SHORT PASS
    ----------------------------
    */
    else if(offense === "short"){
        if(defense === "zone"){
            segments = [
                {label:"INC",value:0},
                {label:"+2",value:2},
                {label:"+4",value:4},
                {label:"+5",value:5},
                {label:"+6",value:6},
                {label:"+8",value:8},
                {label:"+10",value:10},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            segments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+9",value:9},
                {label:"+13",value:13},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            /*
            Short pass is the answer to pressure.
            */
            segments = [
                {label:"SACK",value:-6},
                {label:"INC",value:0},
                {label:"+4",value:4},
                {label:"+6",value:6},
                {label:"+8",value:8},
                {label:"+10",value:10},
                {label:"+14",value:14},
                {label:"+20",value:20}
            ];
        }
    }
    /*
    ----------------------------
    MEDIUM PASS
    ----------------------------
    */
    else if(offense === "medium"){
        if(defense === "zone"){
            segments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+4",value:4},
                {label:"+6",value:6},
                {label:"+9",value:9},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            segments = [
                {label:"INC",value:0},
                {label:"+4",value:4},
                {label:"+7",value:7},
                {label:"+10",value:10},
                {label:"+14",value:14},
                {label:"+18",value:18},
                {label:"+25",value:25},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            segments = [
                {label:"SACK",value:-7},
                {label:"SACK",value:-5},
                {label:"INC",value:0},
                {label:"+5",value:5},
                {label:"+10",value:10},
                {label:"+15",value:15},
                {label:"+25",value:25},
                {label:"TD",value:"td"}
            ];
        }
    }
    /*
    ----------------------------
    DEEP PASS
    ----------------------------
    */
    else if(offense === "deep"){
        if(defense === "zone"){
            /*
            THIS IS INTENTIONALLY HARD.
            */
            segments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+12",value:12},
                {label:"+20",value:20},
                {label:"+35",value:35},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            segments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"+25",value:25},
                {label:"+35",value:35},
                {label:"TD",value:"td"},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            /*
            Blitz vs deep:
            HUGE risk / HUGE reward.
            */
            segments = [
                {label:"SACK",value:-8},
                {label:"SACK",value:-6},
                {label:"INC",value:0},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"+40",value:40},
                {label:"+50",value:50},
                {label:"TD",value:"td"}
            ];
        }
    }
    drawWheel();
}
/* =========================================
SELECT DEFENSE
========================================= */
function selectDefense(value){
    if(spinning || possession !== "you")
        return;
    defense = value;
    [
        "zone",
        "man",
        "blitz",
        "allblitz"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document
    .getElementById(value)
    .classList.add("selected");
    if(offense)
        buildWheel();
    updateSpinButton();
}
/* =========================================
SELECT OFFENSE
========================================= */
function selectOffense(value){
    if(spinning || possession !== "you")
        return;
    offense = value;
    [
        "run",
        "short",
        "medium",
        "deep"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document
    .getElementById(value)
    .classList.add("selected");
    if(defense)
        buildWheel();
    updateSpinButton();
}
/* =========================================
SPIN BUTTON
========================================= */
function updateSpinButton(){
    document.getElementById("spinButton").disabled =
        spinning ||
        possession !== "you" ||
        !defense ||
        !offense;
}
/* =========================================
SPIN
========================================= */
function spinWheel(){
    if(spinning ||
       !defense ||
       !offense ||
       possession !== "you")
        return;
    spinning = true;
    updateSpinButton();
    document.getElementById("result").textContent =
        "🎰 SPINNING...";
    document.getElementById("detail").textContent =
        defense.toUpperCase() +
        " vs " +
        offense.toUpperCase();
    document.getElementById("center").textContent =
        "GOOD\nLUCK";
    /*
    Pick the segment BEFORE spinning.
    */
    const winner =
        Math.floor(
            Math.random() * segments.length
        );
    const segmentAngle =
        360 / segments.length;
    /*
    Pointer is at the top.
    */
    const target =
        360 * 8
        +
        (
            360 -
            (
                winner * segmentAngle
                + segmentAngle / 2
            )
        )
        - 90;
    wheelRotation += target;
    canvas.style.transition =
        "transform 4.8s cubic-bezier(.08,.78,.12,1)";
    canvas.style.transform =
        "rotate(" +
        wheelRotation +
        "deg)";
    /*
    Clock continues during the spin.
    */
    let elapsed = 0;
    const timer =
        setInterval(()=>{
            elapsed++;
            consumeClock(1);
            if(elapsed >= 4)
                clearInterval(timer);
        },1000);
    setTimeout(()=>{
        clearInterval(timer);
        finishSpin(
            segments[winner]
        );
    },5000);
}
/* =========================================
FINISH SPIN
========================================= */
function finishSpin(outcome){
    document.getElementById("center").textContent =
        "RESULT";
    let playTime =
        getPlayTime(outcome);
    consumeClock(playTime);
    /*
    TOUCHDOWN
    */
    if(outcome.value === "td"){
        document.getElementById("result").textContent =
            "🏆 JACKPOT — TOUCHDOWN!";
        document.getElementById("detail").textContent =
            "YOU HIT THE END ZONE! +7";
        yourScore += 7;
        document.getElementById("yourScore").textContent =
            yourScore;
        ball = 100;
        moveBall();
        setTimeout(()=>{
            changePossession();
        },1800);
        return;
    }
    /*
    TURNOVER
    */
    if(outcome.value === "turnover"){
        document.getElementById("result").textContent =
            "💀 INTERCEPTION!";
        document.getElementById("detail").textContent =
            "THE DEFENSE WINS THE GAMBLE.";
        setTimeout(()=>{
            changePossession();
        },1600);
        return;
    }
    let yards = outcome.value;
    document.getElementById("result").textContent =
        yards >= 0
        ? "+" + yards + " YARDS"
        : yards + " YARDS";
    document.getElementById("detail").textContent =
        defense.toUpperCase() +
        " vs " +
        offense.toUpperCase();
    moveBallBy(yards);
}
/* =========================================
PLAY CLOCK
========================================= */
function getPlayTime(outcome){
    if(offense === "run")
        return 22 + Math.floor(Math.random()*13);
    if(offense === "short")
        return 8 + Math.floor(Math.random()*8);
    if(offense === "medium")
        return 7 + Math.floor(Math.random()*7);
    if(offense === "deep")
        return 5 + Math.floor(Math.random()*6);
    return 10;
}
/* =========================================
MOVE BALL
========================================= */
function moveBallBy(yards){
    ball += yards;
    if(ball < 1)
        ball = 1;
    /*
    FIRST DOWN
    */
    if(yards >= yardsToGo){
        down = 1;
        yardsToGo = 10;
    }
    else{
        yardsToGo -= yards;
        if(yards < 0)
            yardsToGo += Math.abs(yards);
        down++;
    }
    /*
    TOUCHDOWN
    */
    if(ball >= 100){
        yourScore += 7;
        document.getElementById("yourScore").textContent =
            yourScore;
        document.getElementById("result").textContent =
            "🏆 TOUCHDOWN!";
        ball = 100;
        moveBall();
        setTimeout(changePossession,1600);
        return;
    }
    /*
    TURNOVER ON DOWNS
    */
    if(down > 4){
        document.getElementById("result").textContent =
            "💀 TURNOVER ON DOWNS";
        setTimeout(changePossession,1300);
        return;
    }
    moveBall();
    updateDisplay();
    setTimeout(resetPlay,1000);
}
/* =========================================
BALL POSITION
========================================= */
function moveBall(){
    const ballElement =
        document.getElementById("ball");
    ballElement.style.left =
        Math.min(ball,97) + "%";
    ballElement.style.top =
        (48 + Math.random()*7) + "%";
    updateDisplay();
}
/* =========================================
RESET PLAY
========================================= */
function resetPlay(){
    if(clock <= 0){
        nextQuarter();
        return;
    }
    defense = null;
    offense = null;
    [
        "zone",
        "man",
        "blitz",
        "allblitz",
        "run",
        "short",
        "medium",
        "deep"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document.getElementById("center").textContent =
        "SPIN";
    document.getElementById("result").textContent =
        "CALL YOUR PLAY";
    document.getElementById("detail").textContent =
        "Defense first. Then offense.";
    updateSpinButton();
}
/* =========================================
CHANGE POSSESSION
========================================= */
function changePossession(){
    possession =
        possession === "you"
        ? "cpu"
        : "you";
    ball = 20;
    down = 1;
    yardsToGo = 10;
    moveBall();
    if(possession === "cpu"){
        document.getElementById("result").textContent =
            "OPPONENT POSSESSION";
        document.getElementById("detail").textContent =
            "The opponent is driving...";
        updatePossession();
        setTimeout(cpuDrive,1000);
    }
    else{
        document.getElementById("result").textContent =
            "🏈 YOUR BALL";
        document.getElementById("detail").textContent =
            "Call your defense and offense.";
        updatePossession();
        resetPlay();
    }
}
/* =========================================
CPU DRIVE
========================================= */
function cpuDrive(){
    if(possession !== "cpu")
        return;
    /*
    CPU automatically plays a drive.
    It doesn't instantly score.
    */
    let roll =
        Math.random();
    let yards;
    if(roll < .12)
        yards = -5;
    else if(roll < .30)
        yards = 0;
    else if(roll < .65)
        yards = 3;
    else if(roll < .86)
        yards = 7;
    else if(roll < .96)
        yards = 12;
    else
        yards = 25;
    consumeClock(
        18 + Math.floor(Math.random()*15)
    );
    ball += yards;
    if(ball >= 100){
        cpuScore += 7;
        document.getElementById("cpuScore").textContent =
            cpuScore;
        document.getElementById("result").textContent =
            "😈 OPPONENT TOUCHDOWN";
        setTimeout(changePossession,1500);
        return;
    }
    if(down >= 4){
        setTimeout(changePossession,1000);
        return;
    }
    if(yards >= yardsToGo){
        down = 1;
        yardsToGo = 10;
    }
    else{
        yardsToGo -= yards;
        down++;
    }
    moveBall();
    updateDisplay();
    setTimeout(cpuDrive,850);
}
/* =========================================
POSSESSION DISPLAY
========================================= */
function updatePossession(){
    document.getElementById("yourPossession").textContent =
        possession === "you"
        ? "🏈 POSSESSION"
        : "—";
    document.getElementById("cpuPossession").textContent =
        possession === "cpu"
        ? "🏈 POSSESSION"
        : "—";
}
/* =========================================
CLOCK
========================================= */
function consumeClock(seconds){
    clock -= seconds;
    if(clock < 0)
        clock = 0;
    updateClock();
    if(clock === 0){
        setTimeout(nextQuarter,500);
    }
}
function updateClock(){
    let minutes =
        Math.floor(clock/60);
    let seconds =
        clock % 60;
    document.getElementById("clock").innerHTML =
        "Q" + quarter +
        "&nbsp;&nbsp;" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");
}
/* =========================================
NEXT QUARTER
========================================= */
function nextQuarter(){
    if(quarter >= 4){
        endGame();
        return;
    }
    quarter++;
    clock = 900;
    ball = 20;
    down = 1;
    yardsToGo = 10;
    /*
    Start next quarter with alternating possession.
    */
    possession =
        possession === "you"
        ? "cpu"
        : "you";
    updateClock();
    updateDisplay();
    updatePossession();
    document.getElementById("result").textContent =
        "Q" + quarter + " STARTS";
    document.getElementById("detail").textContent =
        "15:00 on the clock.";
    setTimeout(()=>{
        if(possession === "cpu")
            cpuDrive();
        else
            resetPlay();
    },1200);
}
/* =========================================
END GAME
========================================= */
function endGame(){
    spinning = true;
    document.getElementById("spinButton").disabled =
        true;
    let message;
    if(yourScore > cpuScore)
        message =
            "🏆 YOU WIN!";
    else if(yourScore < cpuScore)
        message =
            "💀 YOU LOSE";
    else
        message =
            "🤝 TIE GAME";
    document.getElementById("result").textContent =
        message;
    document.getElementById("detail").textContent =
        "FINAL: " +
        yourScore +
        " - " +
        cpuScore;
}
/* =========================================
DISPLAY
========================================= */
function updateDisplay(){
    const downs =
        ["1st","2nd","3rd","4th"];
    document.getElementById("downDistance").textContent =
        downs[down-1] +
        " & " +
        yardsToGo;
    let fieldText;
    if(ball >= 50){
        fieldText =
            "OPPONENT " +
            Math.max(1,100-ball);
    }
    else{
        fieldText =
            "YOUR " +
            ball;
    }
    document.getElementById("fieldStatus").textContent =
        fieldText;
    updateClock();
}
