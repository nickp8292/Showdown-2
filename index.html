<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Football</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#070707;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:8px;
}
.game{
    max-width:1100px;
    margin:auto;
}
/* HEADER */
h1{
    text-align:center;
    margin:3px 0 0;
    font-size:clamp(28px,6vw,52px);
    letter-spacing:3px;
}
.subtitle{
    text-align:center;
    color:#ffd43b;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:8px;
}
/* SCOREBOARD */
.scoreboard{
    display:grid;
    grid-template-columns:1fr 1.4fr 1fr;
    gap:7px;
}
.scorebox{
    background:#151515;
    border:2px solid #444;
    border-radius:10px;
    text-align:center;
    padding:7px;
}
.label{
    color:#aaa;
    font-size:10px;
    text-transform:uppercase;
}
.big{
    font-size:28px;
    font-weight:900;
}
.clock{
    color:#ffd43b;
    font-size:29px;
}
.possession{
    font-size:10px;
    color:#58d7ff;
    margin-top:2px;
}
/* FIELD */
.field-frame{
    margin-top:8px;
    padding:5px;
    background:#111;
    border:2px solid #333;
    border-radius:12px;
}
.field{
    position:relative;
    width:100%;
    aspect-ratio:16/6;
    min-height:215px;
    overflow:hidden;
    border:3px solid white;
    border-radius:7px;
    background:
    repeating-linear-gradient(
        90deg,
        #13753a 0,
        #13753a 4.9%,
        #198442 4.9%,
        #198442 9.8%
    );
}
.yl{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,255,255,.55);
}
.x10{left:10%}
.x20{left:20%}
.x30{left:30%}
.x40{left:40%}
.x50{left:50%;width:3px;background:#fff}
.x60{left:60%}
.x70{left:70%}
.x80{left:80%}
.x90{left:90%}
.endzone{
    position:absolute;
    top:0;
    bottom:0;
    width:10%;
    display:flex;
    align-items:center;
    justify-content:center;
    writing-mode:vertical-rl;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
    background:rgba(0,0,0,.2);
}
.ez1{left:0}
.ez2{right:0}
.field-status{
    position:absolute;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    padding:5px 12px;
    border-radius:15px;
    z-index:4;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}
.ball{
    position:absolute;
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#a95a15;
    border:3px solid white;
    box-shadow:
        0 0 10px #ffd43b,
        0 0 25px rgba(255,212,59,.5);
    z-index:5;
    transition:
        left 1s cubic-bezier(.2,.8,.2,1);
}
.ball::after{
    content:"🏈";
    font-size:20px;
}
/* STATUS */
.status{
    text-align:center;
    min-height:48px;
    padding:5px;
}
.result{
    font-size:25px;
    font-weight:900;
}
.detail{
    color:#aaa;
    font-size:11px;
}
/* =========================
WHEEL
========================= */
.wheel-title{
    text-align:center;
    color:#ffd43b;
    font-size:15px;
    font-weight:bold;
    letter-spacing:2px;
    margin:3px 0;
}
.wheel-area{
    width:min(94vw,500px);
    aspect-ratio:1;
    margin:auto;
    position:relative;
}
#wheel{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:50%;
    transition:
        transform 5s cubic-bezier(.08,.78,.12,1);
    filter:
        drop-shadow(0 0 20px rgba(255,212,59,.5));
    z-index:2;
}
.lights{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:7px dotted #ffd43b;
    animation:rotateLights 1.1s linear infinite;
    z-index:3;
    pointer-events:none;
}
@keyframes rotateLights{
    to{transform:rotate(360deg)}
}
.pointer{
    position:absolute;
    left:50%;
    top:-2px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-top:43px solid white;
    filter:drop-shadow(0 3px 5px #000);
    z-index:10;
}
.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:88px;
    height:88px;
    border-radius:50%;
    background:
        radial-gradient(circle,#ffe56c,#c47c00);
    border:6px solid white;
    color:#111;
    font-size:11px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:8;
    box-shadow:
        0 0 25px rgba(255,212,59,.8);
}
/* CALLS */
.calls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:7px;
}
.panel{
    background:#131313;
    border:2px solid #383838;
    border-radius:10px;
    padding:8px;
}
.panel h2{
    margin:0 0 7px;
    text-align:center;
    font-size:14px;
}
.button-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}
button{
    border:0;
    border-radius:7px;
    padding:12px 5px;
    background:#292929;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#444;
}
button.selected{
    background:#ffd43b;
    color:#111;
    box-shadow:0 0 15px rgba(255,212,59,.6);
}
button:disabled{
    opacity:.25;
    cursor:not-allowed;
}
/* SPIN */
.spin-wrap{
    text-align:center;
    margin-top:8px;
}
.spin{
    width:100%;
    max-width:500px;
    padding:17px;
    font-size:21px;
    background:
        linear-gradient(
            135deg,
            #fff18a,
            #e99c00,
            #fff18a
        );
    color:#111;
    border:3px solid white;
    box-shadow:
        0 0 25px rgba(255,212,59,.5);
}
.spin:not(:disabled){
    animation:pulse 1.4s infinite;
}
@keyframes pulse{
    50%{
        box-shadow:
            0 0 38px rgba(255,212,59,.9);
    }
}
.note{
    text-align:center;
    color:#888;
    font-size:10px;
    margin:5px;
}
@media(max-width:650px){
    .calls{
        grid-template-columns:1fr;
    }
    .field{
        min-height:175px;
    }
    .result{
        font-size:21px;
    }
}
</style>
</head>
<body>
<div class="game">
<h1>🎰 CASINO FOOTBALL</h1>
<div class="subtitle">
CALL THE MATCHUP • SPIN THE ODDS • MOVE THE CHAINS
</div>
<!-- SCOREBOARD -->
<div class="scoreboard">
    <div class="scorebox">
        <div class="label">YOU</div>
        <div class="big" id="youScore">0</div>
        <div class="possession" id="youPossession">
            🏈 BALL
        </div>
    </div>
    <div class="scorebox">
        <div class="label">GAME CLOCK</div>
        <div class="clock" id="clock">
            Q1&nbsp;&nbsp;15:00
        </div>
        <div class="possession" id="situation">
            1st & 10
        </div>
    </div>
    <div class="scorebox">
        <div class="label">CPU</div>
        <div class="big" id="cpuScore">0</div>
        <div class="possession" id="cpuPossession">
            —
        </div>
    </div>
</div>
<!-- FIELD -->
<div class="field-frame">
<div class="field">
    <div class="endzone ez1">
        YOUR END ZONE
    </div>
    <div class="endzone ez2">
        END ZONE
    </div>
    <div class="yl x10"></div>
    <div class="yl x20"></div>
    <div class="yl x30"></div>
    <div class="yl x40"></div>
    <div class="yl x50"></div>
    <div class="yl x60"></div>
    <div class="yl x70"></div>
    <div class="yl x80"></div>
    <div class="yl x90"></div>
    <div class="field-status" id="fieldStatus">
        Your 20
    </div>
    <div class="ball" id="ball"></div>
</div>
</div>
<!-- RESULT -->
<div class="status">
    <div class="result" id="result">
        CALL THE PLAY
    </div>
    <div class="detail" id="detail">
        Pick a defense and offensive play.
    </div>
</div>
<!-- WHEEL -->
<div class="wheel-title">
    🎰 PLAY RESULT WHEEL
</div>
<div class="wheel-area">
    <div class="pointer"></div>
    <canvas
        id="wheel"
        width="700"
        height="700">
    </canvas>
    <div class="lights"></div>
    <div class="center" id="center">
        SPIN
    </div>
</div>
<!-- CALLS -->
<div class="calls">
    <div class="panel">
        <h2>🛡️ DEFENSE</h2>
        <div class="button-grid">
            <button id="zone"
                onclick="chooseDefense('zone')">
                🟢 ZONE
            </button>
            <button id="man"
                onclick="chooseDefense('man')">
                🔵 MAN
            </button>
            <button id="blitz"
                onclick="chooseDefense('blitz')">
                🔥 BLITZ
            </button>
            <button id="allblitz"
                onclick="chooseDefense('allblitz')">
                💥 ALL-OUT
            </button>
        </div>
    </div>
    <div class="panel">
        <h2>🏈 OFFENSE</h2>
        <div class="button-grid">
            <button id="run"
                onclick="chooseOffense('run')">
                🏃 RUN
            </button>
            <button id="short"
                onclick="chooseOffense('short')">
                🟨 SHORT PASS
            </button>
            <button id="medium"
                onclick="chooseOffense('medium')">
                🟦 MEDIUM PASS
            </button>
            <button id="deep"
                onclick="chooseOffense('deep')">
                🔥 DEEP PASS
            </button>
        </div>
    </div>
</div>
<div class="spin-wrap">
    <button
        class="spin"
        id="spin"
        onclick="spin()"
        disabled>
        🎰 SPIN THE WHEEL
    </button>
</div>
<div class="note" id="note">
    Make both calls to unlock the wheel.
</div>
</div>
<script>
/* ==========================================
   STATE
========================================== */
let defense = null;
let offense = null;
let spinning = false;
let possession = "you";
let youScore = 0;
let cpuScore = 0;
let quarter = 1;
let clock = 900;
let ball = 20;
let down = 1;
let toGo = 10;
let rotation = 0;
let wheelSegments = [];
const canvas =
    document.getElementById("wheel");
const ctx =
    canvas.getContext("2d");
/* ==========================================
   DRAW WHEEL
========================================== */
function drawWheel(){
    const cx = 350;
    const cy = 350;
    const radius = 330;
    ctx.clearRect(0,0,700,700);
    const slice =
        Math.PI * 2 / wheelSegments.length;
    wheelSegments.forEach((s,i)=>{
        const a =
            i * slice;
        const b =
            a + slice;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(
            cx,
            cy,
            radius,
            a,
            b
        );
        ctx.closePath();
        ctx.fillStyle =
            wheelColor(s,i);
        ctx.fill();
        ctx.strokeStyle =
            "#fff";
        ctx.lineWidth = 6;
        ctx.stroke();
        /* LABEL */
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(
            a + slice/2
        );
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        let font = 27;
        if(s.label.length > 8)
            font = 18;
        ctx.font =
            "900 " +
            font +
            "px Arial";
        ctx.shadowColor =
            "#000";
        ctx.shadowBlur = 5;
        ctx.fillText(
            s.label,
            radius - 23,
            0
        );
        ctx.restore();
    });
}
/* ==========================================
   WHEEL COLORS
========================================== */
function wheelColor(s,i){
    if(
        s.value === "turnover" ||
        s.label === "PICK"
    )
        return "#7b0615";
    if(
        s.value < 0 ||
        s.label === "SACK"
    )
        return "#a71919";
    if(
        s.value === 0 ||
        s.label === "INC"
    )
        return "#8c1836";
    if(
        s.value >= 20 ||
        s.value === "td"
    )
        return "#008d47";
    if(s.value >= 8)
        return "#1187c4";
    return "#d19e00";
}
/* ==========================================
   BUILD MATCHUP
========================================== */
function buildWheel(){
    /*
    RUN
    */
    if(offense === "run"){
        if(defense === "zone"){
            wheelSegments = [
                {label:"-3",value:-3},
                {label:"0",value:0},
                {label:"+1",value:1},
                {label:"+2",value:2},
                {label:"+2",value:2},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+7",value:7}
            ];
        }
        else if(defense === "man"){
            wheelSegments = [
                {label:"-2",value:-2},
                {label:"0",value:0},
                {label:"+2",value:2},
                {label:"+3",value:3},
                {label:"+4",value:4},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+10",value:10}
            ];
        }
        else{
            wheelSegments = [
                {label:"-6",value:-6},
                {label:"-3",value:-3},
                {label:"0",value:0},
                {label:"+2",value:2},
                {label:"+4",value:4},
                {label:"+7",value:7},
                {label:"+12",value:12},
                {label:"+25",value:25}
            ];
        }
    }
    /*
    SHORT PASS
    */
    else if(offense === "short"){
        if(defense === "zone"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+2",value:2},
                {label:"+4",value:4},
                {label:"+5",value:5},
                {label:"+6",value:6},
                {label:"+9",value:9},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+9",value:9},
                {label:"+12",value:12},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            /*
            Short pass is the best answer
            to a blitz.
            */
            wheelSegments = [
                {label:"SACK",value:-6},
                {label:"INC",value:0},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+9",value:9},
                {label:"+12",value:12},
                {label:"+18",value:18}
            ];
        }
    }
    /*
    MEDIUM PASS
    */
    else if(offense === "medium"){
        if(defense === "zone"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+8",value:8},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"+4",value:4},
                {label:"+7",value:7},
                {label:"+10",value:10},
                {label:"+14",value:14},
                {label:"+18",value:18},
                {label:"+25",value:25},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            wheelSegments = [
                {label:"SACK",value:-7},
                {label:"SACK",value:-5},
                {label:"INC",value:0},
                {label:"+5",value:5},
                {label:"+9",value:9},
                {label:"+15",value:15},
                {label:"+25",value:25},
                {label:"TD",value:"td"}
            ];
        }
    }
    /*
    DEEP PASS
    */
    else if(offense === "deep"){
        if(defense === "zone"){
            /*
            HARD ON PURPOSE.
            */
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+10",value:10},
                {label:"+18",value:18},
                {label:"+30",value:30},
                {label:"PICK",value:"turnover"}
            ];
        }
        else if(defense === "man"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+10",value:10},
                {label:"+15",value:15},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"TD",value:"td"},
                {label:"PICK",value:"turnover"}
            ];
        }
        else{
            /*
            BLITZ + DEEP =
            MASSIVE RISK / REWARD
            */
            wheelSegments = [
                {label:"SACK",value:-8},
                {label:"SACK",value:-6},
                {label:"INC",value:0},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"+40",value:40},
                {label:"+50",value:50},
                {label:"TD",value:"td"}
            ];
        }
    }
    drawWheel();
}
/* ==========================================
   CHOOSE DEFENSE
========================================== */
function chooseDefense(x){
    if(spinning || possession !== "you")
        return;
    defense = x;
    [
        "zone",
        "man",
        "blitz",
        "allblitz"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document
    .getElementById(x)
    .classList.add("selected");
    if(offense)
        buildWheel();
    updateSpin();
}
/* ==========================================
   CHOOSE OFFENSE
========================================== */
function chooseOffense(x){
    if(spinning || possession !== "you")
        return;
    offense = x;
    [
        "run",
        "short",
        "medium",
        "deep"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document
    .getElementById(x)
    .classList.add("selected");
    if(defense)
        buildWheel();
    updateSpin();
}
/* ==========================================
   SPIN BUTTON
========================================== */
function updateSpin(){
    document.getElementById("spin").disabled =
        spinning ||
        possession !== "you" ||
        !defense ||
        !offense;
}
/* ==========================================
   SPIN
========================================== */
function spin(){
    if(
        spinning ||
        !defense ||
        !offense ||
        possession !== "you"
    )
        return;
    spinning = true;
    updateSpin();
    document.getElementById("result").textContent =
        "🎰 THE WHEEL IS SPINNING...";
    document.getElementById("detail").textContent =
        defense.toUpperCase() +
        " vs " +
        offense.toUpperCase();
    document.getElementById("center").textContent =
        "GOOD\nLUCK";
    /*
    The actual winning segment.
    */
    const winner =
        Math.floor(
            Math.random() *
            wheelSegments.length
        );
    const slice =
        360 / wheelSegments.length;
    /*
    Rotate many times,
    then stop with winner
    under pointer.
    */
    const target =
        360 * 8 +
        (
            360 -
            (
                winner * slice +
                slice / 2
            )
        ) -
        90;
    rotation += target;
    canvas.style.transform =
        "rotate(" +
        rotation +
        "deg)";
    /*
    Let the wheel spin.
    */
    setTimeout(()=>{
        finish(
            wheelSegments[winner]
        );
    },5100);
}
/* ==========================================
   FINISH
========================================== */
function finish(outcome){
    let time =
        playTime();
    consumeClock(time);
    /*
    TOUCHDOWN
    */
    if(outcome.value === "td"){
        document.getElementById("result").textContent =
            "🏆 TOUCHDOWN!";
        document.getElementById("detail").textContent =
            "THE GAMBLE PAID OFF.";
        youScore += 7;
        document.getElementById("youScore").textContent =
            youScore;
        ball = 100;
        moveBall();
        setTimeout(changePossession,1600);
        return;
    }
    /*
    INTERCEPTION
    */
    if(outcome.value === "turnover"){
        document.getElementById("result").textContent =
            "💀 INTERCEPTION!";
        document.getElementById("detail").textContent =
            "TURNOVER.";
        setTimeout(changePossession,1500);
        return;
    }
    const yards =
        outcome.value;
    document.getElementById("result").textContent =
        yards >= 0
        ? "+" + yards + " YARDS!"
        : yards + " YARDS";
    movePlay(yards);
}
/* ==========================================
   PLAY TIME
========================================== */
function playTime(){
    if(offense === "run")
        return 22 + Math.floor(Math.random()*14);
    if(offense === "short")
        return 8 + Math.floor(Math.random()*7);
    if(offense === "medium")
        return 7 + Math.floor(Math.random()*7);
    return 5 + Math.floor(Math.random()*7);
}
/* ==========================================
   MOVE PLAY
========================================== */
function movePlay(yards){
    ball += yards;
    if(ball < 1)
        ball = 1;
    /*
    First down.
    */
    if(yards >= toGo){
        down = 1;
        toGo = 10;
    }
    else{
        toGo -= yards;
        if(toGo < 1)
            toGo = 1;
        down++;
    }
    /*
    Touchdown.
    */
    if(ball >= 100){
        ball = 100;
        youScore += 7;
        document.getElementById("youScore").textContent =
            youScore;
        document.getElementById("result").textContent =
            "🏆 TOUCHDOWN!";
        moveBall();
        setTimeout(changePossession,1500);
        return;
    }
    /*
    Fourth down.
    */
    if(down > 4){
        document.getElementById("result").textContent =
            "💀 TURNOVER ON DOWNS";
        setTimeout(changePossession,1400);
        return;
    }
    moveBall();
    updateDisplay();
    setTimeout(resetPlay,1000);
}
/* ==========================================
   BALL
========================================== */
function moveBall(){
    const el =
        document.getElementById("ball");
    el.style.left =
        Math.min(97,Math.max(2,ball)) + "%";
    updateDisplay();
}
/* ==========================================
   RESET PLAY
========================================== */
function resetPlay(){
    if(clock <= 0){
        nextQuarter();
        return;
    }
    defense = null;
    offense = null;
    [
        "zone",
        "man",
        "blitz",
        "allblitz",
        "run",
        "short",
        "medium",
        "deep"
    ].forEach(id=>{
        document
        .getElementById(id)
        .classList.remove("selected");
    });
    document.getElementById("center").textContent =
        "SPIN";
    document.getElementById("result").textContent =
        "CALL THE PLAY";
    document.getElementById("detail").textContent =
        "Pick defense and offense.";
    document.getElementById("note").textContent =
        "Make both calls to unlock the wheel.";
    updateSpin();
}
/* ==========================================
   POSSESSION
========================================== */
function changePossession(){
    possession =
        possession === "you"
        ? "cpu"
        : "you";
    ball = 20;
    down = 1;
    toGo = 10;
    moveBall();
    updatePossession();
    if(possession === "cpu"){
        document.getElementById("result").textContent =
            "😈 CPU POSSESSION";
        document.getElementById("detail").textContent =
            "The opponent takes over.";
        setTimeout(cpuPlay,900);
    }
    else{
        document.getElementById("result").textContent =
            "🏈 YOUR BALL";
        document.getElementById("detail").textContent =
            "Make your defensive and offensive calls.";
        resetPlay();
    }
}
/* ==========================================
   CPU
========================================== */
function cpuPlay(){
    if(possession !== "cpu")
        return;
    /*
    CPU play distribution.
    */
    const r =
        Math.random();
    let yards;
    if(r < .08)
        yards = -6;
    else if(r < .25)
        yards = 0;
    else if(r < .62)
        yards = 3;
    else if(r < .82)
        yards = 6;
    else if(r < .95)
        yards = 10;
    else
        yards = 20;
    consumeClock(
        18 + Math.floor(Math.random()*14)
    );
    ball += yards;
    if(ball >= 100){
        cpuScore += 7;
        document.getElementById("cpuScore").textContent =
            cpuScore;
        document.getElementById("result").textContent =
            "😈 CPU TOUCHDOWN";
        setTimeout(changePossession,1500);
        return;
    }
    if(yards >= toGo){
        down = 1;
        toGo = 10;
    }
    else{
        toGo -= yards;
        if(toGo < 1)
            toGo = 1;
        down++;
    }
    if(down > 4){
        document.getElementById("result").textContent =
            "🛡️ DEFENSE HOLDS!";
        setTimeout(changePossession,1200);
        return;
    }
    moveBall();
    updateDisplay();
    setTimeout(cpuPlay,850);
}
/* ==========================================
   CLOCK
========================================== */
function consumeClock(seconds){
    clock -= seconds;
    if(clock < 0)
        clock = 0;
    updateClock();
    if(clock === 0){
        setTimeout(nextQuarter,600);
    }
}
function updateClock(){
    const min =
        Math.floor(clock/60);
    const sec =
        clock % 60;
    document.getElementById("clock").innerHTML =
        "Q" +
        quarter +
        "&nbsp;&nbsp;" +
        String(min).padStart(2,"0") +
        ":" +
        String(sec).padStart(2,"0");
}
/* ==========================================
   QUARTER
========================================== */
function nextQuarter(){
    if(quarter >= 4){
        endGame();
        return;
    }
    quarter++;
    clock = 900;
    ball = 20;
    down = 1;
    toGo = 10;
    possession =
        possession === "you"
        ? "cpu"
        : "you";
    updateClock();
    updatePossession();
    moveBall();
    document.getElementById("result").textContent =
        "Q" + quarter + " STARTS";
    document.getElementById("detail").textContent =
        "15:00 on the clock.";
    setTimeout(()=>{
        if(possession === "cpu")
            cpuPlay();
        else
            resetPlay();
    },1200);
}
/* ==========================================
   DISPLAY
========================================== */
function updateDisplay(){
    const names =
        ["1st","2nd","3rd","4th"];
    document.getElementById("situation").textContent =
        names[down-1] +
        " & " +
        toGo;
    let location;
    if(ball >= 50){
        location =
            "Opponent " +
            Math.max(1,100-ball);
    }
    else{
        location =
            "Your " +
            ball;
    }
    document.getElementById("fieldStatus").textContent =
        location;
    updateClock();
}
/* ==========================================
   POSSESSION UI
========================================== */
function updatePossession(){
    document.getElementById("youPossession").textContent =
        possession === "you"
        ? "🏈 POSSESSION"
        : "—";
    document.getElementById("cpuPossession").textContent =
        possession === "cpu"
        ? "🏈 POSSESSION"
        : "—";
}
/* ==========================================
   END GAME
========================================== */
function endGame(){
    spinning = true;
    document.getElementById("spin").disabled =
        true;
    let finalMessage;
    if(youScore > cpuScore)
        finalMessage = "🏆 YOU WIN!";
    else if(youScore < cpuScore)
        finalMessage = "💀 CPU WINS";
    else
        finalMessage = "🤝 TIE GAME";
    document.getElementById("result").textContent =
        finalMessage;
    document.getElementById("detail").textContent =
        "FINAL SCORE: " +
        youScore +
        " - " +
        cpuScore;
}
/* ==========================================
   START
========================================== */
wheelSegments = [
    {label:"0",value:0},
    {label:"+2",value:2},
    {label:"+4",value:4},
    {label:"+6",value:6},
    {label:"+8",value:8},
    {label:"+12",value:12},
    {label:"+20",value:20},
    {label:"LOSS",value:-3}
];
drawWheel();
ball = 20;
moveBall();
updateClock();
updatePossession();
</script>
