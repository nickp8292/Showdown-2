<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Casino Football</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #202020, #080808 70%);
    color: white;
    display: flex;
    justify-content: center;
    padding: 15px;
}

.game {
    width: 100%;
    max-width: 1100px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 58px);
    letter-spacing: 3px;
    text-transform: uppercase;
}

.subtitle {
    color: #ffd84a;
    font-size: 14px;
    letter-spacing: 2px;
}

/* =========================
   SCOREBOARD
========================= */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

.scorebox {
    background: linear-gradient(#202020, #111);
    border: 2px solid #444;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.scorebox .label {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
}

.scorebox .value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 4px;
}

/* =========================
   FIELD
========================= */

.field-wrap {
    background: #111;
    border-radius: 16px;
    padding: 10px;
    box-shadow:
        0 0 30px rgba(0,0,0,.8),
        inset 0 0 20px rgba(0,0,0,.8);
}

.field {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 8;
    min-height: 300px;
    overflow: hidden;
    border-radius: 10px;

    background:
        repeating-linear-gradient(
            90deg,
            #16833b 0px,
            #16833b 4.9%,
            #1b9143 4.9%,
            #1b9143 9.8%
        );

    border: 5px solid white;
}

/* yard lines */

.yard {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255,255,255,.65);
}

.yard::after {
    content: "";
    position: absolute;
    top: 8px;
    left: -15px;
    color: rgba(255,255,255,.75);
    font-size: 13px;
    font-weight: bold;
}

.y10 { left: 10%; }
.y20 { left: 20%; }
.y30 { left: 30%; }
.y40 { left: 40%; }
.y50 { left: 50%; }
.y60 { left: 60%; }
.y70 { left: 70%; }
.y80 { left: 80%; }
.y90 { left: 90%; }

.y50 {
    width: 3px;
    background: white;
}

/* hash marks */

.hash {
    position: absolute;
    width: 3px;
    height: 10px;
    background: rgba(255,255,255,.8);
    top: 50%;
}

.hash.left {
    left: 32%;
}

.hash.right {
    left: 68%;
}

/* end zones */

.endzone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 10%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    background: rgba(0,0,0,.18);
}

.endzone.left {
    left: 0;
}

.endzone.right {
    right: 0;
}

/* =========================
   BALL
========================= */

.ball {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: radial-gradient(circle at 35% 30%, #ffcf70, #b76516);
    border: 3px solid #fff;

    font-size: 22px;

    box-shadow:
        0 0 15px rgba(255,220,80,.9),
        0 0 35px rgba(255,190,30,.5);

    z-index: 10;

    transition:
        left 1s cubic-bezier(.2,.8,.2,1),
        top .5s ease;
}

.ball::after {
    content: "🏈";
}

/* =========================
   FIELD INFO
========================= */

.field-info {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(0,0,0,.65);
    padding: 7px 15px;
    border-radius: 30px;

    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    z-index: 5;
}

/* =========================
   PLAY RESULT
========================= */

.result {
    text-align: center;
    min-height: 70px;
    padding: 10px;
}

.result-title {
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
}

.result-detail {
    color: #ccc;
    margin-top: 5px;
}

/* =========================
   CALLING AREA
========================= */

.calls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
}

.panel {
    background: linear-gradient(#191919, #0e0e0e);
    border: 2px solid #3a3a3a;
    border-radius: 12px;
    padding: 12px;
}

.panel h2 {
    text-align: center;
    font-size: 16px;
    margin: 0 0 10px;
    letter-spacing: 1px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 13px 8px;

    color: white;
    background: #292929;

    font-weight: bold;
    cursor: pointer;

    transition:
        transform .12s,
        box-shadow .12s,
        background .12s;
}

button:hover {
    transform: translateY(-2px);
    background: #3b3b3b;
}

button:active {
    transform: scale(.96);
}

button.selected {
    background: linear-gradient(135deg, #ffd84a, #e69b00);
    color: #111;
    box-shadow: 0 0 15px rgba(255,210,50,.55);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   SPIN
========================= */

.spin-area {
    text-align: center;
    margin-top: 12px;
}

.spin {
    width: 100%;
    max-width: 420px;

    font-size: 21px;
    padding: 17px;

    background:
        linear-gradient(
            135deg,
            #ffd84a,
            #ffb000,
            #ffd84a
        );

    color: #111;

    border: 3px solid #fff;

    box-shadow:
        0 0 20px rgba(255,210,50,.35);
}

.spin:hover {
    background: linear-gradient(135deg,#ffe680,#ffbd00,#ffe680);
}

.spin:disabled {
    background: #555;
    color: #aaa;
}

/* =========================
   DRIVE MESSAGE
========================= */

.message {
    text-align: center;
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        padding: 7px;
    }

    .field {
        min-height: 230px;
    }

    .calls {
        grid-template-columns: 1fr;
    }

    .field-info {
        font-size: 11px;
    }

    .ball {
        width: 34px;
        height: 34px;
        font-size: 17px;
    }

    .result-title {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <h1>🎰 Casino Football</h1>
        <div class="subtitle">CALL YOUR PLAY • BEAT THE ODDS</div>
    </div>

    <!-- SCOREBOARD -->

    <div class="scoreboard">

        <div class="scorebox">
            <div class="label">Your Score</div>
            <div class="value" id="userScore">0</div>
        </div>

        <div class="scorebox">
            <div class="label">Down & Distance</div>
            <div class="value" id="downDistance">1st & 10</div>
        </div>

        <div class="scorebox">
            <div class="label">Opponent</div>
            <div class="value" id="opponentScore">0</div>
        </div>

    </div>

    <!-- FIELD -->

    <div class="field-wrap">

        <div class="field" id="field">

            <div class="endzone left">END ZONE</div>
            <div class="endzone right">END ZONE</div>

            <div class="yard y10"></div>
            <div class="yard y20"></div>
            <div class="yard y30"></div>
            <div class="yard y40"></div>
            <div class="yard y50"></div>
            <div class="yard y60"></div>
            <div class="yard y70"></div>
            <div class="yard y80"></div>
            <div class="yard y90"></div>

            <div class="hash left"></div>
            <div class="hash right"></div>

            <div class="field-info" id="fieldInfo">
                Ball on your 20
            </div>

            <div class="ball" id="ball"></div>

        </div>

    </div>

    <!-- RESULT -->

    <div class="result">

        <div class="result-title" id="resultTitle">
            CALL THE PLAY
        </div>

        <div class="result-detail" id="resultDetail">
            Choose a defensive call and offensive play.
        </div>

    </div>

    <!-- CALLS -->

    <div class="calls">

        <!-- DEFENSE -->

        <div class="panel">

            <h2>🛡️ DEFENSE</h2>

            <div class="buttons">

                <button onclick="chooseDefense('zone')" id="zone">
                    🟢 ZONE
                </button>

                <button onclick="chooseDefense('man')" id="man">
                    🔵 MAN
                </button>

                <button onclick="chooseDefense('blitz')" id="blitz">
                    🔥 BLITZ
                </button>

                <button onclick="chooseDefense('allblitz')" id="allblitz">
                    💥 ALL-OUT
                </button>

            </div>

        </div>

        <!-- OFFENSE -->

        <div class="panel">

            <h2>🏈 OFFENSE</h2>

            <div class="buttons">

                <button onclick="chooseOffense('run')" id="run">
                    🏃 RUN
                </button>

                <button onclick="chooseOffense('short')" id="short">
                    🟨 SHORT PASS
                </button>

                <button onclick="chooseOffense('medium')" id="medium">
                    🟦 MEDIUM PASS
                </button>

                <button onclick="chooseOffense('deep')" id="deep">
                    🔥 DEEP PASS
                </button>

            </div>

        </div>

    </div>

    <!-- SPIN -->

    <div class="spin-area">

        <button
            class="spin"
            id="spinButton"
            onclick="spinPlay()"
            disabled
        >
            🎰 SPIN FOR THE PLAY
        </button>

    </div>

    <div class="message" id="message">
        Make your calls.
    </div>

</div>


<script>

/* =========================================
   GAME STATE
========================================= */

let defenseCall = null;
let offenseCall = null;

let ballPosition = 20;

let down = 1;
let yardsToGo = 10;

let userScore = 0;
let opponentScore = 0;


/* =========================================
   BUTTON HELPERS
========================================= */

function clearSelected(group) {

    if (group === "defense") {

        ["zone","man","blitz","allblitz"].forEach(id => {
            document.getElementById(id).classList.remove("selected");
        });

    }

    if (group === "offense") {

        ["run","short","medium","deep"].forEach(id => {
            document.getElementById(id).classList.remove("selected");
        });

    }
}


/* =========================================
   DEFENSE
========================================= */

function chooseDefense(call) {

    defenseCall = call;

    clearSelected("defense");

    document.getElementById(call).classList.add("selected");

    updateSpinButton();

    document.getElementById("message").textContent =
        "Defense selected: " + call.toUpperCase();
}


/* =========================================
   OFFENSE
========================================= */

function chooseOffense(call) {

    offenseCall = call;

    clearSelected("offense");

    document.getElementById(call).classList.add("selected");

    updateSpinButton();

    document.getElementById("message").textContent =
        "Offense selected: " + call.toUpperCase();
}


/* =========================================
   ENABLE SPIN
========================================= */

function updateSpinButton() {

    document.getElementById("spinButton").disabled =
        !(defenseCall && offenseCall);

}


/* =========================================
   PLAY RESULT ENGINE
========================================= */

function spinPlay() {

    if (!defenseCall || !offenseCall) return;

    document.getElementById("spinButton").disabled = true;

    let outcome = getPlayOutcome();

    showResult(outcome);

}


/* =========================================
   MATCHUP ENGINE
========================================= */

function getPlayOutcome() {

    let roll = Math.random() * 100;

    let yards = 0;
    let text = "";
    let type = "normal";

    /*
       RUN
    */

    if (offenseCall === "run") {

        if (defenseCall === "zone") {

            if (roll < 8) {
                yards = -3;
                text = "RUN STUFFED";
            }
            else if (roll < 22) {
                yards = 0;
                text = "NO ROOM";
            }
            else if (roll < 50) {
                yards = 2;
                text = "SHORT GAIN";
            }
            else if (roll < 78) {
                yards = 4;
                text = "SOLID RUN";
            }
            else if (roll < 94) {
                yards = 7;
                text = "BIG RUN";
            }
            else {
                yards = 15;
                text = "BREAKAWAY!";
                type = "big";
            }

        }

        else if (defenseCall === "man") {

            if (roll < 7) {
                yards = -2;
                text = "TACKLED FOR LOSS";
            }
            else if (roll < 20) {
                yards = 0;
                text = "STOPPED";
            }
            else if (roll < 43) {
                yards = 3;
                text = "SHORT RUN";
            }
            else if (roll < 73) {
                yards = 5;
                text = "GOOD RUN";
            }
            else if (roll < 93) {
                yards = 8;
                text = "BIG RUN";
            }
            else {
                yards = 18;
                text = "BREAKAWAY!";
                type = "big";
            }

        }

        else if (defenseCall === "blitz") {

            if (roll < 5) {
                yards = -5;
                text = "BLITZ GETS HOME";
            }
            else if (roll < 15) {
                yards = -2;
                text = "BACKFIELD HIT";
            }
            else if (roll < 32) {
                yards = 2;
                text = "CREASE CLOSED";
            }
            else if (roll < 58) {
                yards = 5;
                text = "RUNS THROUGH THE BLITZ";
            }
            else if (roll < 86) {
                yards = 9;
                text = "GREAT CALL!";
            }
            else {
                yards = 25;
                text = "TOUCHDOWN RUN!";
                type = "touchdown";
            }

        }

        else {

            if (roll < 15) {
                yards = -6;
                text = "CRUSHED IN THE BACKFIELD";
            }
            else if (roll < 35) {
                yards = -1;
                text = "DEFENSE SWARMS";
            }
            else if (roll < 60) {
                yards = 2;
                text = "BARELY ANY ROOM";
            }
            else if (roll < 82) {
                yards = 5;
                text = "NICE RUN";
            }
            else {
                yards = 10;
                text = "BIG RUN!";
                type = "big";
            }

        }

    }


    /*
       SHORT PASS
    */

    else if (offenseCall === "short") {

        if (defenseCall === "zone") {

            if (roll < 12) {
                text = "INCOMPLETE";
                yards = 0;
            }
            else if (roll < 58) {
                yards = 5;
                text = "COMPLETION";
            }
            else if (roll < 87) {
                yards = 8;
                text = "NICE CATCH";
            }
            else {
                yards = 15;
                text = "YAC!";
                type = "big";
            }

        }

        else if (defenseCall === "man") {

            if (roll < 18) {
                text = "INCOMPLETE";
                yards = 0;
            }
            else if (roll < 60) {
                yards = 5;
                text = "COMPLETION";
            }
            else if (roll < 88) {
                yards = 9;
                text = "GOOD CATCH";
            }
            else {
                yards = 16;
                text = "BURNED THE DEFENDER!";
                type = "big";
            }

        }

        else {

            if (roll < 10) {
                yards = -6;
                text = "SACK!";
            }
            else if (roll < 22) {
                yards = 0;
                text = "INCOMPLETE";
            }
            else if (roll < 65) {
                yards = 6;
                text = "QUICK COMPLETION";
            }
            else if (roll < 92) {
                yards = 11;
                text = "GREAT THROW!";
            }
            else {
                yards = 22;
                text = "HOUSE CALL!";
                type = "big";
            }

        }

    }


    /*
       MEDIUM PASS
    */

    else if (offenseCall === "medium") {

        if (defenseCall === "zone") {

            if (roll < 28) {
                yards = 0;
                text = "INCOMPLETE";
            }
            else if (roll < 62) {
                yards = 7;
                text = "COMPLETION";
            }
            else if (roll < 87) {
                yards = 13;
                text = "BIG COMPLETION";
                type = "big";
            }
            else if (roll < 96) {
                yards = 20;
                text = "HUGE GAIN!";
                type = "big";
            }
            else {
                yards = -1;
                text = "INTERCEPTION!";
                type = "turnover";
            }

        }

        else if (defenseCall === "man") {

            if (roll < 23) {
                yards = 0;
                text = "INCOMPLETE";
            }
            else if (roll < 58) {
                yards = 8;
                text = "COMPLETION";
            }
            else if (roll < 84) {
                yards = 15;
                text = "BIG CATCH!";
                type = "big";
            }
            else if (roll < 94) {
                yards = 25;
                text = "BREAKAWAY!";
                type = "big";
            }
            else {
                yards = -1;
                text = "INTERCEPTION!";
                type = "turnover";
            }

        }

        else {

            if (roll < 25) {
                yards = -7;
                text = "SACK!";
            }
            else if (roll < 40) {
                yards = 0;
                text = "PRESSURE — INCOMPLETE";
            }
            else if (roll < 70) {
                yards = 8;
                text = "COMPLETION";
            }
            else if (roll < 91) {
                yards = 16;
                text = "GREAT THROW!";
                type = "big";
            }
            else {
                yards = 35;
                text = "TOUCHDOWN!";
                type = "touchdown";
            }

        }

    }


    /*
       DEEP PASS
    */

    else {

        if (defenseCall === "zone") {

            if (roll < 50) {
                yards = 0;
                text = "INCOMPLETE";
            }
            else if (roll < 72) {
                yards = 15;
                text = "COMPLETION!";
                type = "big";
            }
            else if (roll < 88) {
                yards = 28;
                text = "BOMB!";
                type = "big";
            }
            else if (roll < 95) {
                yards = 45;
                text = "TOUCHDOWN!";
                type = "touchdown";
            }
            else {
                yards = -1;
                text = "INTERCEPTION!";
                type = "turnover";
            }

        }

        else if (defenseCall === "man") {

            if (roll < 38) {
                yards = 0;
                text = "INCOMPLETE";
            }
            else if (roll < 60) {
                yards = 18;
                text = "COMPLETION!";
                type = "big";
            }
            else if (roll < 78) {
                yards = 30;
                text = "BURNED HIM!";
                type = "big";
            }
            else if (roll < 94) {
                yards = 45;
                text = "TOUCHDOWN!";
                type = "touchdown";
            }
            else {
                yards = -1;
                text = "INTERCEPTION!";
                type = "turnover";
            }

        }

        else {

            if (roll < 25) {
                yards = -8;
                text = "SACK!";
            }
            else if (roll < 37) {
                yards = 0;
                text = "PRESSURE — INCOMPLETE";
            }
            else if (roll < 55) {
                yards = 20;
                text = "CAUGHT!";
                type = "big";
            }
            else if (roll < 75) {
                yards = 35;
                text = "DEEP BALL!";
                type = "big";
            }
            else if (roll < 94) {
                yards = 50;
                text = "TOUCHDOWN BOMB!";
                type = "touchdown";
            }
            else {
                yards = -1;
                text = "INTERCEPTION!";
                type = "turnover";
            }

        }

    }


    return {
        yards,
        text,
        type
    };
}


/* =========================================
   SHOW RESULT
========================================= */

function showResult(outcome) {

    let resultTitle = document.getElementById("resultTitle");
    let resultDetail = document.getElementById("resultDetail");

    resultTitle.textContent = outcome.text;

    if (outcome.type === "touchdown") {

        resultTitle.textContent = "🏆 TOUCHDOWN! 🏆";

        userScore += 7;

        resultDetail.textContent =
            "JACKPOT! +7 points";

        document.getElementById("userScore").textContent =
            userScore;

        animateBall(true);

        setTimeout(resetDrive, 1500);

        return;
    }

    if (outcome.type === "turnover") {

        resultTitle.textContent = "💀 TURNOVER";

        resultDetail.textContent =
            "The defense wins the gamble.";

        setTimeout(resetPlay, 1300);

        return;
    }

    resultDetail.textContent =
        (outcome.yards >= 0 ? "+" : "") +
        outcome.yards +
        " yards • " +
        defenseCall.toUpperCase() +
        " vs " +
        offenseCall.toUpperCase();

    moveBall(outcome.yards);

}


/* =========================================
   MOVE BALL
========================================= */

function moveBall(yards) {

    ballPosition += yards;

    if (ballPosition >= 100) {

        userScore += 7;

        document.getElementById("userScore").textContent =
            userScore;

        document.getElementById("resultTitle").textContent =
            "🏆 TOUCHDOWN!";

        document.getElementById("resultDetail").textContent =
            "You reached the end zone!";

        animateBall(true);

        setTimeout(resetDrive, 1500);

        return;
    }

    if (ballPosition < 1) {
        ballPosition = 1;
    }

    animateBall(false);

    if (yards >= yardsToGo) {

        down = 1;
        yardsToGo = 10;

    }
    else {

        yardsToGo -= yards;

        if (yards < 0) {
            yardsToGo += Math.abs(yards);
        }

        down++;

        if (down > 4) {

            resultTitle.textContent =
                "💀 TURNOVER ON DOWNS";

            resultDetail.textContent =
                "The defense wins the gamble.";

            setTimeout(resetDrive, 1500);

            return;
        }

    }

    updateDisplay();

    setTimeout(resetPlay, 1000);
}


/* =========================================
   BALL ANIMATION
========================================= */

function animateBall(touchdown) {

    let ball = document.getElementById("ball");

    if (touchdown) {
        ball.style.left = "95%";
    }
    else {
        ball.style.left = ballPosition + "%";
    }

    ball.style.top =
        (48 + Math.random() * 8) + "%";
}


/* =========================================
   RESET PLAY
========================================= */

function resetPlay() {

    defenseCall = null;
    offenseCall = null;

    clearSelected("defense");
    clearSelected("offense");

    updateSpinButton();

    document.getElementById("message").textContent =
        "Make your next calls.";

    updateDisplay();
}


/* =========================================
   RESET DRIVE
========================================= */

function resetDrive() {

    ballPosition = 20;

    down = 1;
    yardsToGo = 10;

    document.getElementById("ball").style.left =
        ballPosition + "%";

    resetPlay();

    document.getElementById("resultTitle").textContent =
        "NEW DRIVE";

    document.getElementById("resultDetail").textContent =
        "Ball at your 20. Let's go!";
}


/* =========================================
   DISPLAY

    }

}
