<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Showdown Digital</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #243b55 0%, #101722 45%, #080c12 100%);
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

/* HEADER */

.header {
    text-align: center;
    padding: 10px;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 4px 15px black;
}

.subtitle {
    color: #aebbd0;
    margin-top: 5px;
}

/* PANELS */

.panel {
    background: rgba(25,35,50,.96);
    border: 1px solid #40516a;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

/* BUTTONS */

button {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg,#2878ed,#1451ae);
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(30,110,230,.35);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

/* START */

.start-title {
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 15px;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #52657f;
    background: #26364c;
    color: white;
    font-size: 16px;
    margin: 7px 0 15px;
}

/* DRAFT */

.draft-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
}

.draft-info {
    text-align: center;
    color: #aebbd0;
    margin-bottom: 15px;
}

.draft-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
    gap: 12px;
}

.player-card {
    background:
        linear-gradient(145deg,#283b55,#162131);
    border: 1px solid #526985;
    border-radius: 15px;
    padding: 13px;
    cursor: pointer;
    transition: .15s;
}

.player-card:hover {
    transform: translateY(-4px);
    border-color: #4d9aff;
    box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

.player-photo {
    height: 100px;
    border-radius: 10px;
    background:
        linear-gradient(135deg,#344b68,#111a27);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    margin-bottom: 10px;
}

.player-name {
    font-size: 19px;
    font-weight: 900;
}

.player-position {
    color: #8fa4bd;
    font-size: 13px;
    margin-bottom: 8px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.stat {
    background: rgba(0,0,0,.3);
    padding: 6px;
    border-radius: 6px;
    font-size: 13px;
}

.stat strong {
    color: #ffd43b;
}

/* LINEUP */

.lineup {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}

.lineup-slot {
    display: flex;
    align-items: center;
    background: #101923;
    border: 1px solid #34475e;
    border-radius: 10px;
    padding: 10px;
}

.slot-number {
    width: 30px;
    color: #ffd43b;
    font-weight: 900;
}

.slot-player {
    font-weight: 800;
}

/* SCOREBOARD */

.scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    text-align: center;
    align-items: center;
}

.team-label {
    font-size: 14px;
    color: #9eacc0;
}

.score {
    font-size: 48px;
    font-weight: 900;
}

.inning {
    font-size: 18px;
    font-weight: bold;
}

.outs {
    margin-top: 5px;
    color: #ffcc4d;
    font-weight: bold;
}

/* AT BAT */

.matchup {
    text-align: center;
    font-size: 27px;
    font-weight: 900;
}

.batter-card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: linear-gradient(135deg,#20334d,#121b28);
    border-radius: 15px;
    padding: 14px;
    margin-top: 15px;
}

.batter-avatar {
    width: 75px;
    height: 75px;
    border-radius: 12px;
    background: #314966;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
}

.batter-info {
    flex: 1;
}

.batter-name {
    font-size: 21px;
    font-weight: 900;
}

.batter-stats {
    color: #a9b7ca;
    font-size: 13px;
    margin-top: 4px;
}

/* ADVANTAGE */

.advantage {
    text-align: center;
    margin: 18px 0;
    padding: 15px;
    border-radius: 12px;
    font-size: 22px;
    font-weight: 900;
}

.pitcher-advantage {
    background: linear-gradient(135deg,#401d25,#711e29);
    border: 1px solid #d54a5b;
}

.hitter-advantage {
    background: linear-gradient(135deg,#173c2a,#17613d);
    border: 1px solid #42c886;
}

.neutral {
    background: #29384b;
}

/* DICE */

.dice-area {
    text-align: center;
}

.dice {
    width: 105px;
    height: 105px;
    margin: 15px auto;
    background: white;
    color: #111;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    font-weight: 900;
    box-shadow:
        inset 0 -7px 0 #c6c6c6,
        0 8px 20px rgba(0,0,0,.45);
}

.roll-animation {
    animation: shake .45s infinite;
}

@keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(8deg) scale(1.08); }
    50% { transform: rotate(-8deg) scale(1.08); }
    75% { transform: rotate(5deg); }
    100% { transform: rotate(0deg); }
}

.roll-label {
    font-size: 15px;
    color: #a9b7ca;
}

.target {
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    margin: 10px;
}

.target span {
    color: #ffd43b;
}

/* BASES */

.bases-title {
    text-align: center;
    font-weight: 900;
}

.diamond {
    width: 150px;
    height: 150px;
    border: 3px solid white;
    transform: rotate(45deg);
    margin: 40px auto;
    position: relative;
}

.base {
    width: 27px;
    height: 27px;
    background: white;
    border: 2px solid #111;
    position: absolute;
}

.first {
    right: -15px;
    top: 60px;
}

.second {
    left: 60px;
    top: -15px;
}

.third {
    left: -15px;
    top: 60px;
}

.home {
    left: 60px;
    bottom: -15px;
}

.occupied {
    background: #ffd43b;
    box-shadow: 0 0 15px #ffd43b;
}

/* RESULT */

.result {
    min-height: 45px;
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    margin: 12px;
}

/* LOG */

.log {
    max-height: 250px;
    overflow-y: auto;
    background: #080d14;
    border-radius: 10px;
    padding: 10px;
}

.log-entry {
    padding: 8px;
    border-bottom: 1px solid #263342;
    font-size: 14px;
}

/* HIDDEN */

.hidden {
    display: none !important;
}

@media(max-width:600px) {

    .logo {
        font-size: 29px;
    }

    .score {
        font-size: 36px;
    }

    .matchup {
        font-size: 22px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="logo">⚾ MLB SHOWDOWN</div>
    <div class="subtitle">DIGITAL BASEBALL • DICE • STRATEGY</div>
</div>


<!-- ================= START ================= -->

<div id="startScreen" class="panel">

<div class="start-title">
    BUILD YOUR TEAMS
</div>

<label>Team A</label>

<select id="teamA">
    <option>New York</option>
    <option>Los Angeles</option>
    <option>Boston</option>
    <option>Atlanta</option>
</select>

<label>Team B</label>

<select id="teamB">
    <option>Los Angeles</option>
    <option>New York</option>
    <option>Boston</option>
    <option>Atlanta</option>
</select>

<button onclick="beginDraft()">
    🃏 ENTER DRAFT
</button>

</div>


<!-- ================= DRAFT ================= -->

<div id="draftScreen" class="hidden">

<div class="panel">

<div class="draft-title">
    🃏 PLAYER DRAFT
</div>

<div id="draftInfo" class="draft-info"></div>

<div id="draftPlayers" class="draft-grid"></div>

</div>

<div class="panel">

<h2>YOUR LINEUP</h2>

<div id="draftLineup" class="lineup"></div>

<button id="startGameButton" onclick="startGame()" disabled>
    ⚾ START GAME
</button>

</div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen" class="hidden">


<div class="panel scoreboard">

<div>
    <div class="team-label" id="teamNameA">TEAM A</div>
    <div id="scoreA" class="score">0</div>
</div>

<div>
    <div id="half">TOP</div>
    <div class="inning">
        INNING <span id="inning">1</span>
    </div>
    <div id="outs" class="outs">0 OUTS</div>
</div>

<div>
    <div class="team-label" id="teamNameB">TEAM B</div>
    <div id="scoreB" class="score">0</div>
</div>

</div>


<!-- AT BAT -->

<div class="panel">

<div id="matchup" class="matchup">
    READY
</div>

<div class="batter-card">

<div class="batter-avatar">
    ⚾
</div>

<div class="batter-info">

<div id="batterName" class="batter-name">
    Batter
</div>

<div id="batterStats" class="batter-stats">
    Power 10 • Contact 10 • Speed 10
</div>

</div>

</div>


<div id="advantage" class="advantage neutral">
    ROLL THE PITCHER D20
</div>


<div class="dice-area">

<div id="rollLabel" class="roll-label">
    PITCHER ROLL
</div>

<div id="dice" class="dice">
    🎲
</div>

</div>


<div id="target" class="target">
    Pitcher must roll first
</div>


<button id="pitchButton" onclick="pitch()">
    🎲 ROLL PITCHER D20
</button>

<button id="swingButton" onclick="swing()" disabled>
    ⚾ ROLL HITTER D20
</button>


<div id="result" class="result"></div>


<button id="nextButton" onclick="nextBatter()" disabled>
    ➡️ NEXT BATTER
</button>

</div>


<!-- BASES -->

<div class="panel">

<div class="bases-title">
    BASE RUNNERS
</div>

<div class="diamond">

<div id="first" class="base first"></div>
<div id="second" class="base second"></div>
<div id="third" class="base third"></div>
<div class="base home"></div>

</div>

</div>


<!-- LOG -->

<div class="panel">

<b>📜 GAME LOG</b>

<div id="log" class="log"></div>

</div>


<button onclick="location.reload()">
    🔄 NEW GAME
</button>

</div>

</div>


<script>


/* =====================================================
PLAYER DATABASE
===================================================== */

const players = [

{
name:"Aaron Judge",
team:"New York",
pos:"OF",
power:20,
contact:14,
speed:8,
pitcher:false
},

{
name:"Juan Soto",
team:"New York",
pos:"OF",
power:18,
contact:18,
speed:11,
pitcher:false
},

{
name:"Giancarlo Stanton",
team:"New York",
pos:"DH",
power:18,
contact:9,
speed:5,
pitcher:false
},

{
name:"Anthony Volpe",
team:"New York",
pos:"SS",
power:11,
contact:14,
speed:18,
pitcher:false
},

{
name:"Jazz Chisholm Jr.",
team:"New York",
pos:"2B",
power:15,
contact:13,
speed:18,
pitcher:false
},

{
name:"Shohei Ohtani",
team:"Los Angeles",
pos:"DH",
power:20,
contact:18,
speed:17,
pitcher:false
},

{
name:"Mookie Betts",
team:"Los Angeles",
pos:"OF",
power:16,
contact:18,
speed:16,
pitcher:false
},

{
name:"Freddie Freeman",
team:"Los Angeles",
pos:"1B",
power:17,
contact:19,
speed:7,
pitcher:false
},

{
name:"Will Smith",
team:"Los Angeles",
pos:"C",
power:15,
contact:15,
speed:6,
pitcher:false
},

{
name:"Teoscar Hernandez",
team:"Los Angeles",
pos:"OF",
power:17,
contact:12,
speed:10,
pitcher:false
},

{
name:"Rafael Devers",
team:"Boston",
pos:"3B",
power:18,
contact:16,
speed:6,
pitcher:false
},

{
name:"Jarren Duran",
team:"Boston",
pos:"OF",
power:12,
contact:15,
speed:20,
pitcher:false
},

{
name:"Trevor Story",
team:"Boston",
pos:"SS",
power:14,
contact:13,
speed:15,
pitcher:false
},

{
name:"Triston Casas",
team:"Boston",
pos:"1B",
power:17,
contact:14,
speed:5,
pitcher:false
},

{
name:"Ronald Acuna Jr.",
team:"Atlanta",
pos:"OF",
power:19,
contact:17,
speed:19,
pitcher:false
},

{
name:"Matt Olson",
team:"Atlanta",
pos:"1B",
power:19,
contact:13,
speed:6,
pitcher:false
},

{
name:"Austin Riley",
team:"Atlanta",
pos:"3B",
power:17,
contact:14,
speed:7,
pitcher:false
},

{
name:"Ozzie Albies",
team:"Atlanta",
pos:"2B",
power:14,
contact:16,
speed:17,
pitcher:false
}

];


/* =====================================================
LINEUP
===================================================== */

let lineupA = [];
let lineupB = [];

let draftPool = [];

let draftingTeam = "A";

let draftCountA = 0;
let draftCountB = 0;


/* =====================================================
GAME VARIABLES
===================================================== */

let scoreA = 0;
let scoreB = 0;

let inning = 1;

let half = 0;

let outs = 0;

let batterIndexA = 0;
let batterIndexB = 0;

let pitcherRoll = null;

let runners = [false,false,false];

let gameStarted = false;


/* =====================================================
BEGIN DRAFT
===================================================== */

function beginDraft() {

    lineupA = [];
    lineupB = [];

    draftCountA = 0;
    draftCountB = 0;

    draftingTeam = "A";

    draftPool = [...players];

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("draftScreen")
        .classList.remove("hidden");

    renderDraft();

}


/* =====================================================
DRAFT DISPLAY
===================================================== */

function renderDraft() {

    const teamA =
        document.getElementById("teamA").value;

    const teamB =
        document.getElementById("teamB").value;

    const currentTeam =
        draftingTeam === "A"
        ? teamA
        : teamB;

    document.getElementById("draftInfo").innerHTML =
        `<b>${currentTeam}</b> is drafting.
        Pick ${draftingTeam === "A"
        ? draftCountA + 1
        : draftCountB + 1}
        of 9`;

    const container =
        document.getElementById("draftPlayers");

    container.innerHTML = "";

    draftPool.forEach((player,index) => {

        const card =
            document.createElement("div");

        card.className = "player-card";

        card.innerHTML = `

        <div class="player-photo">
            ⚾
        </div>

        <div class="player-name">
            ${player.name}
        </div>

        <div class="player-position">
            ${player.team} • ${player.pos}
        </div>

        <div class="stats">

            <div class="stat">
                Power <strong>${player.power}</strong>
            </div>

            <div class="stat">
                Contact <strong>${player.contact}</strong>
            </div>

            <div class="stat">
                Speed <strong>${player.speed}</strong>
            </div>

            <div class="stat">
                Overall <strong>
                ${Math.round(
                    (player.power+
                    player.contact+
                    player.speed)/3
                )}
                </strong>
            </div>

        </div>
        `;

        card.onclick = () =>
            draftPlayer(index);

        container.appendChild(card);

    });

    renderLineup();

}


/* =====================================================
DRAFT PLAYER
===================================================== */

function draftPlayer(index) {

    const player = draftPool[index];

    if (!player) return;


    if (draftingTeam === "A") {

        lineupA.push(player);

        draftCountA++;

        draftingTeam = "B";

    }

    else {

        lineupB.push(player);

        draftCountB++;

        draftingTeam = "A";

    }


    draftPool.splice(index,1);


    if (
        lineupA.length >= 9 &&
        lineupB.length >= 9
    ) {

        document.getElementById("startGameButton")
            .disabled = false;

        document.getElementById("draftInfo")
            .innerHTML =
            "🔥 Both teams have completed their draft!";

        renderLineup();

        return;

    }


    renderDraft();

}


/* =====================================================
LINEUP DISPLAY
===================================================== */

function renderLineup() {

    const container =
        document.getElementById("draftLineup");

    container.innerHTML = "";

    const current =
        draftingTeam === "A"
        ? lineupA
        : lineupB;

    current.forEach((player,index) => {

        const div =
            document.createElement("div");

        div.className = "lineup-slot";

        div.innerHTML = `

        <div class="slot-number">
            ${index+1}
        </div>

        <div class="slot-player">
            ${player.name}
            <span style="color:#8295ad">
            — ${player.pos}
            </span>
        </div>

        `;

        container.appendChild(div);

    });

}


/* =====================================================
START GAME
===================================================== */

function startGame() {

    if (
        lineupA.length < 9 ||
        lineupB.length < 9
    ) {

        alert("Both teams need 9 players.");

        return;
    }


    scoreA = 0;
    scoreB = 0;

    inning = 1;

    half = 0;

    outs = 0;

    batterIndexA = 0;
    batterIndexB = 0;

    runners = [false,false,false];

    pitcherRoll = null;

    gameStarted = true;


    document.getElementById("draftScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");


    document.getElementById("teamNameA")
        .textContent =
        document.getElementById("teamA").value;

    document.getElementById("teamNameB")
        .textContent =
        document.getElementById("teamB").value;


    document.getElementById("log")
        .innerHTML = "";


    addLog("⚾ Game started!");

    resetAtBat();

    update();

}


/* =====================================================
CURRENT BATTER
===================================================== */

function currentBatter() {

    if (half === 0) {

        return lineupA[batterIndexA];

    }

    return lineupB[batterIndexB];

}


/* =====================================================
PITCH
===================================================== */

function pitch() {

    if (!gameStarted) return;

    if (pitcherRoll !== null) return;


    animateDice(() => {

        pitcherRoll = d20();


        document.getElementById("dice")
            .textContent = pitcherRoll;


        document.getElementById("rollLabel")
            .textContent =
            "PITCHER ROLL";


        document.getElementById("pitchButton")
            .disabled = true;


        document.getElementById("swingButton")
            .disabled = false;


        determineAdvantage();

    });

}


/* =====================================================
ADVANTAGE
===================================================== */

function determineAdvantage() {

    const batter =
        currentBatter();


    /*
    Pitcher roll is compared to hitter
    contact rating.

    If pitcher roll is greater:
    pitcher advantage.

    If hitter contact is greater:
    hitter advantage.
    */

    if (pitcherRoll > batter.contact) {

        document.getElementById("advantage")
            .className =
            "advantage pitcher-advantage";

        document.getElementById("advantage")
            .textContent =
            "🔥 PITCHER ADVANTAGE";

        document.getElementById("target")
            .innerHTML =
            `Hitter needs
            <span>${getHitterTarget()}</span>
            or higher to get on base`;

    }

    else if (pitcherRoll < batter.contact) {

        document.getElementById("advantage")
            .className =
            "advantage hitter-advantage";

        document.getElementById("advantage")
            .textContent =
            "🔥 HITTER ADVANTAGE";

        document.getElementById("target")
            .innerHTML =
            `Hitter needs
            <span>${getHitterTarget()}</span>
            or higher to get on base`;

    }

    else {

        document.getElementById("advantage")
            .className =
            "advantage neutral";

        document.getElementById("advantage")
            .textContent =
            "⚔️ EVEN MATCHUP";

        document.getElementById("target")
            .innerHTML =
            `Hitter needs
            <span>${getHitterTarget()}</span>
            or higher`;

    }

}


/* =====================================================
HITTER TARGET
===================================================== */

function getHitterTarget() {

    const batter =
        currentBatter();


    /*
    Better contact means easier roll.

    Pitcher advantage increases target.

    Power determines extra-base results.
    */

    let target =
        11 - Math.floor(batter.contact / 5);


    if (pitcherRoll > batter.contact) {

        target += 2;

    }

    else if (pitcherRoll < batter.contact) {

        target -= 2;

    }


    if (target < 3) target = 3;

    if (target > 18) target = 18;


    return target;

}


/* =====================================================
SWING
===================================================== */

function swing() {

    if (!gameStarted) return;

    if (pitcherRoll === null) return;


    animateDice(() => {

        const batter =
            currentBatter();

        const swingRoll =
            d20();

        document.getElementById("dice")
            .textContent = swingRoll;

        document.getElementById("rollLabel")
            .textContent =
            "HITTER ROLL";


        const target =
            getHitterTarget();


        let result;


        if (swingRoll < target) {

            /*
            Failed to reach target.
            */

            result =
                swingRoll <= 6
                ? "STRIKEOUT"
                : "GROUND OUT";

            outs++;

        }

        else {

            /*
            Successful contact.

            Higher rolls produce
            better hits.
            */

            const margin =
                swingRoll - target;


            if (margin >= 7) {

                result = "HOME RUN";

                scoreRuns(
                    1 + runnerCount()
                );

                runners =
                    [false,false,false];

            }

            else if (margin >= 5) {

                result = "TRIPLE";

                scoreRuns(
                    runnerCount()
                );

                runners =
                    [true,false,false];

            }

            else if (margin >= 3) {

                result = "DOUBLE";

                let runs = 0;

                if (runners[2]) runs++;

                if (runners[1]) runs++;

                scoreRuns(runs);

                runners =
                    [false,true,true];

            }

            else {

                result = "SINGLE";

                if (runners[2]) {

                    scoreRuns(1);

                }

                runners =
                    [
                        true,
                        runners[0],
                        runners[1]
                    ];

            }

        }


        addLog(
            `${batter.name} — Pitcher ${pitcherRoll}
            vs Hitter ${swingRoll}
            → ${result}`
        );


        document.getElementById("result")
            .textContent =
            result;


        document.getElementById("swingButton")
            .disabled = true;

        document.getElementById("nextButton")
            .disabled = false;


        update();

    });

}


/* =====================================================
DICE ANIMATION
===================================================== */

function animateDice(callback) {

    const dice =
        document.getElementById("dice");

    dice.classList.add("roll-animation");


    let count = 0;


    const interval =
        setInterval(() => {

            dice.textContent =
                Math.floor(
                    Math.random()*20
                ) + 1;

            count++;


            if (count >= 8) {

                clearInterval(interval);

                dice.classList.remove(
                    "roll-animation"
                );

                callback();

            }

        },70);

}


/* =====================================================
D20
===================================================== */

function d20() {

    return Math.floor(
        Math.random()*20
    ) + 1;

}


/* =====================================================
RUNNERS
===================================================== */

function runnerCount() {

    return runners.filter(Boolean).length;

}


/* =====================================================
SCORE
===================================================== */

function scoreRuns(number) {

    if (half === 0) {

        scoreA += number;

    }

    else {

        scoreB += number;

    }

}


/* =====================================================
NEXT BATTER
===================================================== */

function nextBatter() {

    /*
    THIS IS THE IMPORTANT FIX.

    Every time NEXT BATTER is pressed,
    the pitcher roll is completely reset.

    This allows another pitcher roll
    on every single at-bat.
    */

    pitcherRoll = null;


    if (half === 0) {

        batterIndexA++;

    }

    else {

        batterIndexB++;

    }


    if (outs >= 3) {

        outs = 0;

        runners =
            [false,false,false];


        if (half === 0) {

            half = 1;

        }

        else {

            half = 0;

            inning++;

        }


        if (inning > 9) {

            endGame();

            return;

        }

    }


    resetAtBat();

    update();

}


/* =====================================================
RESET AT BAT
===================================================== */

function resetAtBat() {

    pitcherRoll = null;


    document.getElementById("pitchButton")
        .disabled = false;


    document.getElementById("swingButton")
        .disabled = true;


    document.getElementById("nextButton")
        .disabled = true;


    document.getElementById("dice")
        .textContent = "🎲";


    document.getElementById("rollLabel")
        .textContent =
        "PITCHER ROLL";


    document.getElementById("result")
        .textContent = "";


    document.getElementById("advantage")
        .className =
        "advantage neutral";


    document.getElementById("advantage")
        .textContent =
        "ROLL THE PITCHER D20";


    document.getElementById("target")
        .textContent =
        "Pitcher must roll first";

}


/* =====================================================
UPDATE
===================================================== */

function update() {

    const batter =
        currentBatter();


    document.getElementById("scoreA")
        .textContent = scoreA;


    document.getElementById("scoreB")
        .textContent = scoreB;


    document.getElementById("inning")
        .textContent = inning;


    document.getElementById("half")
        .textContent =
        half === 0
        ? "TOP"
        : "BOTTOM";


    document.getElementById("outs")
        .textContent =
        outs + " OUTS";


    document.getElementById("matchup")
        .textContent =
        batter.name + " — AT BAT";


    document.getElementById("batterName")
        .textContent =
        batter.name;


    document.getElementById("batterStats")
        .textContent =
        `Power ${batter.power}
        • Contact ${batter.contact}
        • Speed ${batter.speed}`;


    document.getElementById("first")
        .classList.toggle(
            "occupied",
            runners[0]
        );


    document.getElementById("second")
        .classList.toggle(
            "occupied",
            runners[1]
        );


    document.getElementById("third")
        .classList.toggle(
            "occupied",
            runners[2]
        );

}


/* =====================================================
END GAME
===================================================== */

function endGame() {

    let message;


    if (scoreA > scoreB) {

        message =
            "🏆 TEAM A WINS!";

    }

    else if (scoreB > scoreA) {

        message =
            "🏆 TEAM B WINS!";

    }

    else {

        message =
            "🤝 TIE GAME";

    }


    document.getElementById("result")
        .textContent =
        message;


    document.getElementById("pitchButton")
        .disabled = true;


    document.getElementById("swingButton")
        .disabled = true;


    document.getElementById("nextButton")
        .disabled = true;


    addLog(message);

}


/* =====================================================
GAME LOG
===================================================== */

function addLog(text) {

    const log =
        document.getElementById("log");


    const entry =
        document.createElement("div");


    entry.className =
        "log-entry";


    entry.textContent = text;


    log.prepend(entry);

}

</script>
