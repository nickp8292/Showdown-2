<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Football</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:
        radial-gradient(circle at top,#242424,#070707 75%);
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    padding:10px;
}
.game{
    width:100%;
    max-width:1100px;
    margin:auto;
}
/* HEADER */
header{
    text-align:center;
    margin-bottom:8px;
}
header h1{
    margin:0;
    font-size:clamp(28px,6vw,54px);
    letter-spacing:3px;
    text-transform:uppercase;
}
.subtitle{
    color:#ffd84a;
    font-size:12px;
    letter-spacing:2px;
}
/* SCOREBOARD */
.scoreboard{
    display:grid;
    grid-template-columns:1fr 1.2fr 1fr;
    gap:7px;
    margin-bottom:9px;
}
.box{
    background:linear-gradient(#202020,#0e0e0e);
    border:2px solid #3d3d3d;
    border-radius:10px;
    padding:7px;
    text-align:center;
}
.label{
    color:#999;
    font-size:10px;
    text-transform:uppercase;
}
.value{
    font-size:23px;
    font-weight:900;
    margin-top:2px;
}
.clock{
    color:#ffd84a;
    font-size:27px;
}
/* FIELD */
.field-container{
    background:#111;
    border:2px solid #333;
    border-radius:14px;
    padding:7px;
    margin-bottom:9px;
}
.field{
    position:relative;
    width:100%;
    aspect-ratio:16/7;
    min-height:260px;
    overflow:hidden;
    border-radius:8px;
    background:
    repeating-linear-gradient(
        90deg,
        #16803a 0%,
        #16803a 4.95%,
        #1b9144 4.95%,
        #1b9144 9.9%
    );
    border:4px solid white;
}
/* YARD LINES */
.line{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,255,255,.55);
}
.l10{left:10%}
.l20{left:20%}
.l30{left:30%}
.l40{left:40%}
.l50{left:50%;width:3px;background:white}
.l60{left:60%}
.l70{left:70%}
.l80{left:80%}
.l90{left:90%}
/* END ZONES */
.endzone{
    position:absolute;
    top:0;
    bottom:0;
    width:10%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:12px;
    letter-spacing:2px;
    writing-mode:vertical-rl;
    background:rgba(0,0,0,.18);
}
.endzone.left{left:0}
.endzone.right{right:0}
/* FIELD INFO */
.field-info{
    position:absolute;
    top:9px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.72);
    border-radius:20px;
    padding:6px 13px;
    font-size:12px;
    font-weight:bold;
    z-index:4;
    white-space:nowrap;
}
/* BALL */
.ball{
    position:absolute;
    width:39px;
    height:39px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle at 35% 30%,#ffd878,#a9530e);
    border:3px solid white;
    box-shadow:
        0 0 12px #ffd84a,
        0 0 25px rgba(255,200,30,.55);
    z-index:5;
    transition:
        left 1s cubic-bezier(.2,.8,.2,1),
        top .45s ease;
}
.ball::after{
    content:"🏈";
    font-size:20px;
}
/* PLAY AREA */
.play-status{
    text-align:center;
    min-height:52px;
    padding:5px;
}
.result{
    font-size:26px;
    font-weight:900;
    text-transform:uppercase;
}
.detail{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
}
/* WHEEL */
.wheel-area{
    display:flex;
    justify-content:center;
    margin:5px 0 10px;
}
.wheel-box{
    position:relative;
    width:min(88vw,440px);
    aspect-ratio:1;
}
canvas{
    width:100%;
    height:100%;
    display:block;
    filter:
        drop-shadow(0 0 15px rgba(255,210,50,.25));
}
.pointer{
    position:absolute;
    top:-3px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-top:38px solid #fff;
    filter:drop-shadow(0 3px 4px #000);
    z-index:5;
}
.wheel-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:75px;
    height:75px;
    border-radius:50%;
    background:
        radial-gradient(circle,#ffd84a,#b87300);
    border:5px solid white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:900;
    color:#111;
    text-align:center;
    box-shadow:
        0 0 20px rgba(255,210,50,.7);
}
/* CALL PANELS */
.calls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}
.panel{
    background:linear-gradient(#191919,#0c0c0c);
    border:2px solid #383838;
    border-radius:11px;
    padding:9px;
}
.panel h2{
    margin:0 0 7px;
    text-align:center;
    font-size:14px;
}
.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}
button{
    border:0;
    border-radius:7px;
    padding:12px 5px;
    background:#292929;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}
button:hover{
    transform:translateY(-2px);
    background:#414141;
}
button.selected{
    background:linear-gradient(135deg,#ffe16a,#e59c00);
    color:#111;
    box-shadow:0 0 13px rgba(255,210,50,.5);
}
button:disabled{
    opacity:.3;
    cursor:not-allowed;
    transform:none;
}
/* SPIN BUTTON */
.spin-area{
    text-align:center;
    margin-top:9px;
}
.spin{
    width:100%;
    max-width:430px;
    font-size:21px;
    padding:16px;
    background:
        linear-gradient(135deg,#ffe36a,#f2a900,#ffe36a);
    color:#111;
    border:3px solid white;
    box-shadow:
        0 0 18px rgba(255,210,50,.45);
}
.spin:hover{
    background:
        linear-gradient(135deg,#fff09b,#ffc400,#fff09b);
}
.message{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:6px;
}
/* MOBILE */
@media(max-width:700px){
    body{
        padding:5px;
    }
    .field{
        min-height:200px;
    }
    .calls{
        grid-template-columns:1fr;
    }
    .wheel-box{
        width:min(94vw,390px);
    }
    .result{
        font-size:22px;
    }
}
</style>
</head>
<body>
<div class="game">
<header>
    <h1>🎰 Casino Football</h1>
    <div class="subtitle">
        CALL IT • SPIN IT • MOVE THE CHAINS
    </div>
</header>
<!-- SCOREBOARD -->
<div class="scoreboard">
    <div class="box">
        <div class="label">Your Score</div>
        <div class="value" id="userScore">0</div>
    </div>
    <div class="box">
        <div class="label">Quarter • Game Clock</div>
        <div class="value clock" id="clock">Q1&nbsp;&nbsp;15:00</div>
    </div>
    <div class="box">
        <div class="label">Down & Distance</div>
        <div class="value" id="downDistance">
            1st & 10
        </div>
    </div>
</div>
<!-- FIELD -->
<div class="field-container">
<div class="field">
    <div class="endzone left">YOUR END ZONE</div>
    <div class="endzone right">END ZONE</div>
    <div class="line l10"></div>
    <div class="line l20"></div>
    <div class="line l30"></div>
    <div class="line l40"></div>
    <div class="line l50"></div>
    <div class="line l60"></div>
    <div class="line l70"></div>
    <div class="line l80"></div>
    <div class="line l90"></div>
    <div class="field-info" id="fieldInfo">
        Ball on your 20
    </div>
    <div class="ball" id="ball"></div>
</div>
</div>
<!-- RESULT -->
<div class="play-status">
    <div class="result" id="result">
        CALL THE PLAY
    </div>
    <div class="detail" id="detail">
        Choose the defense and offense.
    </div>
</div>
<!-- WHEEL -->
<div class="wheel-area">
    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="wheel-center" id="wheelCenter">
            SPIN
        </div>
    </div>
</div>
<!-- CALLS -->
<div class="calls">
    <div class="panel">
        <h2>🛡️ DEFENSE</h2>
        <div class="buttons">
            <button id="zone"
                onclick="chooseDefense('zone')">
                🟢 ZONE
            </button>
            <button id="man"
                onclick="chooseDefense('man')">
                🔵 MAN
            </button>
            <button id="blitz"
                onclick="chooseDefense('blitz')">
                🔥 BLITZ
            </button>
            <button id="allblitz"
                onclick="chooseDefense('allblitz')">
                💥 ALL-OUT
            </button>
        </div>
    </div>
    <div class="panel">
        <h2>🏈 OFFENSE</h2>
        <div class="buttons">
            <button id="run"
                onclick="chooseOffense('run')">
                🏃 RUN
            </button>
            <button id="short"
                onclick="chooseOffense('short')">
                🟨 SHORT PASS
            </button>
            <button id="medium"
                onclick="chooseOffense('medium')">
                🟦 MEDIUM PASS
            </button>
            <button id="deep"
                onclick="chooseOffense('deep')">
                🔥 DEEP PASS
            </button>
        </div>
    </div>
</div>
<div class="spin-area">
    <button
        class="spin"
        id="spinButton"
        onclick="spinWheel()"
        disabled>
        🎰 SPIN FOR THE PLAY
    </button>
</div>
<div class="message" id="message">
    Make your calls.
</div>
</div>
<script>
/* =========================================
   GAME STATE
========================================= */
let defenseCall = null;
let offenseCall = null;
let ballPosition = 20;
let down = 1;
let yardsToGo = 10;
let score = 0;
let quarter = 1;
let clockSeconds = 900;
let spinning = false;
let wheelRotation = 0;
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
/* =========================================
   WHEEL DATA
========================================= */
let wheelSegments = [
    {label:"+3",value:3},
    {label:"+5",value:5},
    {label:"+8",value:8},
    {label:"+12",value:12},
    {label:"+20",value:20},
    {label:"INCOMPLETE",value:0},
    {label:"LOSS",value:-3},
    {label:"TURNOVER",value:"turnover"}
];
/* =========================================
   DRAW WHEEL
========================================= */
function drawWheel(){
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 285;
    ctx.clearRect(0,0,600,600);
    const segmentAngle =
        (Math.PI * 2) / wheelSegments.length;
    wheelSegments.forEach((segment,i)=>{
        const start =
            i * segmentAngle;
        const end =
            start + segmentAngle;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );
        ctx.closePath();
        /*
        Alternating casino colors.
        */
        const colors = [
            "#0c9b4b",
            "#e0b800",
            "#1591d1",
            "#e67e22",
            "#0c9b4b",
            "#8b1e3f",
            "#b21f1f",
            "#4b0710"
        ];
        ctx.fillStyle =
            colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 5;
        ctx.stroke();
        /* TEXT */
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(
            start +
            segmentAngle / 2
        );
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px Arial";
        ctx.fillText(
            segment.label,
            radius - 25,
            0
        );
        ctx.restore();
    });
    /*
       Outer ring
    */
    ctx.beginPath();
    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 12;
    ctx.stroke();
}
/* =========================================
   MATCHUP WHEEL
========================================= */
function buildWheel(){
    /*
       RUN
    */
    if(offenseCall === "run"){
        if(defenseCall === "blitz"){
            wheelSegments = [
                {label:"+2",value:2},
                {label:"+5",value:5},
                {label:"+8",value:8},
                {label:"+12",value:12},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"LOSS",value:-3},
                {label:"FUMBLE",value:"turnover"}
            ];
        }
        else if(defenseCall === "zone"){
            wheelSegments = [
                {label:"0",value:0},
                {label:"+1",value:1},
                {label:"+2",value:2},
                {label:"+3",value:3},
                {label:"+4",value:4},
                {label:"+6",value:6},
                {label:"LOSS",value:-2},
                {label:"FUMBLE",value:"turnover"}
            ];
        }
        else {
            wheelSegments = [
                {label:"0",value:0},
                {label:"+2",value:2},
                {label:"+4",value:4},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+10",value:10},
                {label:"+15",value:15},
                {label:"LOSS",value:-2}
            ];
        }
    }
    /*
       SHORT PASS
    */
    else if(offenseCall === "short"){
        if(defenseCall === "blitz" ||
           defenseCall === "allblitz"){
            wheelSegments = [
                {label:"SACK",value:-6},
                {label:"INC",value:0},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+9",value:9},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"TD",value:"td"}
            ];
        } else {
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+3",value:3},
                {label:"+5",value:5},
                {label:"+7",value:7},
                {label:"+9",value:9},
                {label:"+12",value:12},
                {label:"+15",value:15}
            ];
        }
    }
    /*
       MEDIUM PASS
    */
    else if(offenseCall === "medium"){
        if(defenseCall === "zone"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+5",value:5},
                {label:"+8",value:8},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"+25",value:25},
                {label:"INT",value:"turnover"}
            ];
        }
        else if(defenseCall === "blitz"){
            wheelSegments = [
                {label:"SACK",value:-7},
                {label:"SACK",value:-5},
                {label:"INC",value:0},
                {label:"+8",value:8},
                {label:"+12",value:12},
                {label:"+18",value:18},
                {label:"+30",value:30},
                {label:"TD",value:"td"}
            ];
        }
        else {
            wheelSegments = [
                {label:"INC",value:0},
                {label:"+5",value:5},
                {label:"+8",value:8},
                {label:"+12",value:12},
                {label:"+15",value:15},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"INT",value:"turnover"}
            ];
        }
    }
    /*
       DEEP PASS
    */
    else {
        if(defenseCall === "zone"){
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+15",value:15},
                {label:"+25",value:25},
                {label:"+35",value:35},
                {label:"TD",value:"td"},
                {label:"INT",value:"turnover"}
            ];
        }
        else if(defenseCall === "blitz" ||
                defenseCall === "allblitz"){
            wheelSegments = [
                {label:"SACK",value:-8},
                {label:"INC",value:0},
                {label:"+20",value:20},
                {label:"+30",value:30},
                {label:"+40",value:40},
                {label:"+50",value:50},
                {label:"TD",value:"td"},
                {label:"INT",value:"turnover"}
            ];
        }
        else {
            wheelSegments = [
                {label:"INC",value:0},
                {label:"INC",value:0},
                {label:"+15",value:15},
                {label:"+20",value:20},
                {label:"+25",value:25},
                {label:"+35",value:35},
                {label:"TD",value:"td"},
                {label:"INT",value:"turnover"}
            ];
        }
    }
    drawWheel();
}
/* =========================================
   CALLS
========================================= */
function chooseDefense(call){
    if(spinning) return;
    defenseCall = call;
    ["zone","man","blitz","allblitz"]
        .forEach(id=>{
            document
                .getElementById(id)
                .classList.remove("selected");
        });
    document
        .getElementById(call)
        .classList.add("selected");
    buildWheel();
    updateSpin();
    document.getElementById("message").textContent =
        "Defense: " + call.toUpperCase();
}
function chooseOffense(call){
    if(spinning) return;
    offenseCall = call;
    ["run","short","medium","deep"]
        .forEach(id=>{
            document
                .getElementById(id)
                .classList.remove("selected");
        });
    document
        .getElementById(call)
        .classList.add("selected");
    buildWheel();
    updateSpin();
    document.getElementById("message").textContent =
        "Offense: " + call.toUpperCase();
}
function updateSpin(){
    document.getElementById("spinButton").disabled =
        !(defenseCall && offenseCall) || spinning;
}
/* =========================================
   SPIN WHEEL
========================================= */
function spinWheel(){
    if(spinning) return;
    if(!defenseCall || !offenseCall) return;
    spinning = true;
    updateSpin();
    document.getElementById("result").textContent =
        "🎰 SPINNING...";
    document.getElementById("detail").textContent =
        defenseCall.toUpperCase() +
        " vs " +
        offenseCall.toUpperCase();
    document.getElementById("wheelCenter").textContent =
        "GOOD LUCK";
    /*
       Choose result BEFORE animation.
    */
    const winner =
        Math.floor(
            Math.random() *
            wheelSegments.length
        );
    const segmentAngle =
        360 / wheelSegments.length;
    /*
       Pointer is at the top.
       Calculate target angle.
    */
    const target =
        360 * 7
        +
        (360 - (
            winner * segmentAngle
            + segmentAngle / 2
        ))
        - 90;
    wheelRotation += target;
    canvas.style.transition =
        "transform 4.2s cubic-bezier(.12,.8,.18,1)";
    canvas.style.transform =
        "rotate(" + wheelRotation + "deg)";
    /*
       Animate clock slightly while wheel spins.
    */
    let fakeTime = 0;
    const clockTimer =
        setInterval(()=>{
            fakeTime++;
            if(fakeTime <= 4){
                clockSeconds =
                    Math.max(
                        0,
                        clockSeconds - 1
                    );
                updateClock();
            }
        },1000);
    setTimeout(()=>{
        clearInterval(clockTimer);
        const outcome =
            wheelSegments[winner];
        finishPlay(outcome);
    },4300);
}
/* =========================================
   FINISH PLAY
========================================= */
function finishPlay(outcome){
    spinning = false;
    document.getElementById("wheelCenter").textContent =
        "RESULT";
    if(outcome.value === "td"){
        document.getElementById("result").textContent =
            "🏆 TOUCHDOWN!";
        document.getElementById("detail").textContent =
            "JACKPOT! YOU HIT THE END ZONE!";
        score += 7;
        document.getElementById("userScore").textContent =
            score;
        moveBallToEndzone();
        addPlayTime(8);
        setTimeout(resetDrive,1800);
        return;
    }
    if(outcome.value === "turnover"){
        document.getElementById("result").textContent =
            "💀 TURNOVER!";
        document.getElementById("detail").textContent =
            "THE DEFENSE WINS THE GAMBLE.";
        addPlayTime(8);
        setTimeout(resetDrive,1600);
        return;
    }
    let yards = outcome.value;
    document.getElementById("result").textContent =
        yards >= 0
        ? "+" + yards + " YARDS!"
        : yards + " YARDS";
    document.getElementById("detail").textContent =
        defenseCall.toUpperCase() +
        " vs " +
        offenseCall.toUpperCase();
    /*
       Different plays consume different amounts of clock.
    */
    let playTime = 12;
    if(offenseCall === "run")
        playTime = 25 + Math.floor(Math.random()*12);
    if(offenseCall === "short")
        playTime = 10 + Math.floor(Math.random()*8);
    if(offenseCall === "medium")
        playTime = 9 + Math.floor(Math.random()*7);
    if(offenseCall === "deep")
        playTime = 6 + Math.floor(Math.random()*6);
    if(yards < 0)
        playTime += 5;
    addPlayTime(playTime);
    moveBall(yards);
}
/* =========================================
   MOVE BALL
========================================= */
function moveBall(yards){
    ballPosition += yards;
    if(ballPosition >= 100){
        score += 7;
        document.getElementById("userScore").textContent =
            score;
        document.getElementById("result").textContent =
            "🏆 TOUCHDOWN!";
        moveBallToEndzone();
        setTimeout(resetDrive,1700);
        return;
    }
    if(ballPosition < 1)
        ballPosition = 1;
    /*
       First down
    */
    if(yards >= yardsToGo){
        down = 1;
        yardsToGo = 10;
    }
    else{
        yardsToGo -= yards;
        down++;
        if(down > 4){
            document.getElementById("result").textContent =
                "💀 TURNOVER ON DOWNS";
            document.getElementById("detail").textContent =
                "THE DEFENSE WINS THE GAMBLE.";
            setTimeout(resetDrive,1500);
            return;
        }
    }
    updateDisplay();
    setTimeout(resetPlay,1100);
}
/* =========================================
   BALL TO ENDZONE
========================================= */
function moveBallToEndzone(){
    const ball =
        document.getElementById("ball");
    ball.style.left = "94%";
    ball.style.top =
        (45 + Math.random()*10) + "%";
}
/* =========================================
   RESET PLAY
========================================= */
function resetPlay(){
    if(clockSeconds <= 0){
        nextQuarter();
        return;
    }
    defenseCall = null;
    offenseCall = null;
    ["zone","man","blitz","allblitz",
     "run","short","medium","deep"]
        .forEach(id=>{
            document
                .getElementById(id)
                .classList.remove("selected");
        });
    document.getElementById("result").textContent =
        "CALL THE PLAY";
    document.getElementById("detail").textContent =
        "Choose the defense and offense.";
    document.getElementById("message").textContent =
        "Make your next calls.";
    document.getElementById("wheelCenter").textContent =
        "SPIN";
    updateSpin();
    drawWheel();
}
/* =========================================
   RESET DRIVE
========================================= */
function resetDrive(){
    ballPosition = 20;
    down = 1;
    yardsToGo = 10;
    document.getElementById("ball").style.left =
        ballPosition + "%";
    document.getElementById("ball").style.top =
        "52%";
    resetPlay();
    document.getElementById("result").textContent =
        "NEW DRIVE";
    document.getElementById("detail").textContent =
        "Ball at your 20.";
}
/* =========================================
   CLOCK
========================================= */
function addPlayTime(seconds){
    clockSeconds =
        Math.max(
            0,
            clockSeconds - seconds
        );
    updateClock();
    if(clockSeconds === 0){
        setTimeout(nextQuarter,500);
    }
}
function updateClock(){
    const minutes =
        Math.floor(clockSeconds / 60);
    const seconds =
        clockSeconds % 60;
    document.getElementById("clock").innerHTML =
        "Q" + quarter +
        "&nbsp;&nbsp;" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");
}
function nextQuarter(){
    if(quarter >= 4){
        endGame();
        return;
    }
    quarter++;
    clockSeconds = 900;
    document.getElementById("result").textContent =
        "QUARTER " + quarter;
    document.getElementById("detail").textContent =
        "15:00 on the clock.";
    updateClock();
}
/* =========================================
   END GAME
========================================= */
function endGame(){
    document.getElementById("result").textContent =
        "🏆 GAME OVER";
    document.getElementById("detail").textContent =
        "FINAL SCORE: " + score;
    document.getElementById("spinButton").disabled =
        true;
    spinning = true;
}
/* =========================================
   DISPLAY
========================================= */
function updateDisplay(){
    const downs =
        ["1st","2nd","3rd","4th"];
    document.getElementById("downDistance").textContent =
        downs[down-1] +
        " & " +
        yardsToGo;
    const yard =
        Math.round(ballPosition);
    if(yard >= 50){
        document.getElementById("fieldInfo").textContent =
            "Opponent " +
            (100-yard);
    }
    else{
        document.getElementById("fieldInfo").textContent =
            "Your " +
            yard;
    }
    updateClock();
}
/* =========================================
   START
========================================= */
drawWheel();
document.getElementById("ball").style.left =
    ballPosition + "%";
document.getElementById("ball").style.top =
    "52%";
updateDisplay();
</script>
</body>
</html>
